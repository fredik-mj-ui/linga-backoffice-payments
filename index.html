<title>Linga Payments Prototype</title>
<meta name="description" content="Clickable prototype of the Linga back office with white-label payments onboarding.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto:wght@400;500&display=swap">
<style>
/* Layout: Linga back-office shell (74px top bar + 206px menu) around a centered 566px onboarding card, built from the Figma tokens.
   Single light theme on purpose: it mirrors the Linga back office in Figma. */
:root {
  --page: #ffffff;
  --heading: #1d1a1a;
  --body: #322f2f;
  --placeholder: #6a6a6a;
  --muted: #5d6976;
  --border: #e0e0e0;
  --border-input: #adaaaa;
  --action: #1b7ba2;
  --action-text: #166282;
  --selected: #a4cada;
  --depression: #f2f0f0;
  --elevation: #f7f9fd;
  --badge: #f5f5f5;
  --danger: #de1f1f;
  --danger-bg: #fdecec;
  --success: #2a7f05;
  --upload: #008600;
  --avatar: #6954ff;
  --scrim: rgba(29, 26, 26, 0.48);
  --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --font-legacy: "Roboto", "Inter", system-ui, Arial, sans-serif;
  --font-mono: Menlo, ui-monospace, "SFMono-Regular", Consolas, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--page); color: var(--body); font-family: var(--font); font-size: 14px; line-height: 20px; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
a { color: inherit; }
img { display: block; max-width: none; }
:focus-visible { outline: 2px solid var(--action); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

#app { height: 100%; }

/* ---------- Start page ---------- */
.start { min-height: 100%; display: flex; flex-direction: column; align-items: center; padding-block: 56px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--elevation); }
.start-inner { width: 100%; max-width: 980px; display: flex; flex-direction: column; gap: 32px; }
.start-head { display: flex; flex-direction: column; gap: 12px; }
.start-head h1 { margin: 0; font-size: 32px; line-height: 40px; color: var(--heading); text-wrap: balance; }
.start-head p { margin: 0; font-size: 16px; line-height: 24px; max-width: 62ch; }
.eyebrow { font-size: 12px; line-height: 16px; letter-spacing: .08em; text-transform: uppercase; color: var(--action-text); font-weight: 600; }
.paths { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.path { display: flex; flex-direction: column; gap: 12px; text-align: left; padding: 24px; background: var(--page); border: 1px solid var(--border); border-radius: 16px; transition: border-color .15s, box-shadow .15s; }
.path:hover { border-color: var(--action); box-shadow: 0 2px 8px rgba(27, 123, 162, .12); }
.path h2 { margin: 0; font-size: 18px; line-height: 24px; color: var(--heading); }
.path p { margin: 0; color: var(--body); }
.path .meta { margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-top: 8px; }
.path .go { font-weight: 600; color: var(--action-text); }
.path .icon-dot { width: 44px; height: 44px; border-radius: 1000px; background: var(--depression); display: grid; place-items: center; }
.pill { display: inline-flex; align-items: center; padding: 1px 6px; border-radius: 4px; font-size: 12px; line-height: 16px; background: var(--badge); color: var(--body); white-space: nowrap; }
.pill.ready { background: #e6f2ea; color: #1d5e2a; }
.pill.pending { background: #fff2e5; color: #994f01; }
.start-note { font-size: 13px; color: var(--muted); }

/* ---------- Shell ---------- */
.shell { height: 100%; display: flex; flex-direction: column; }
.topbar { flex: none; height: 74px; display: flex; align-items: center; padding-right: 20px; border-bottom: 1px solid var(--border); background: var(--page); }
.collapse { width: 61px; height: 100%; display: grid; place-items: center; border-right: 1px solid var(--border); flex: none; }
.brand { width: 171px; height: 74px; display: grid; place-items: center; flex: none; }
.loc { display: flex; align-items: center; gap: 10px; padding-left: 11px; flex: none; }
.loc-select { display: flex; align-items: center; justify-content: space-between; width: 252px; height: 39px; padding: 0 17px 0 12px; border: 1px solid var(--border-input); border-radius: 4px; font-size: 16px; line-height: 20px; color: var(--body); }
.flex-space { flex: 1 1 0; min-width: 8px; }
.actions { display: flex; align-items: center; gap: 16px; flex: none; }
.search { display: flex; align-items: center; gap: 8px; width: 213px; height: 36px; padding: 0 9px 0 10px; border: 1px solid var(--action); border-radius: 4px; color: var(--muted); font-size: 16px; }
.kbd { margin-left: auto; height: 22px; padding: 0 6px; display: flex; align-items: center; border: 1px solid #dddfe2; background: #f5f5f5; border-radius: 7px; font: 12px var(--font-legacy); color: var(--muted); white-space: nowrap; }
.notif { position: relative; width: 36px; height: 36px; }
.notif img { position: absolute; left: 0; top: -10px; }
.sq { width: 36px; height: 36px; border: 1px solid var(--action); border-radius: 4px; display: grid; place-items: center; }
.upgrade { height: 36px; width: 81px; border: 1px solid var(--action); border-radius: 4px; font: 500 14px var(--font-legacy); color: var(--action-text); }
.upload { width: 36px; height: 36px; border-radius: 4px; background: var(--upload); display: grid; place-items: center; box-shadow: 2px 2px 3px rgba(0, 0, 0, .19); }
.account { display: flex; align-items: center; gap: 10px; }
.account .div { width: 1px; height: 40px; background: var(--border); }
.avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--avatar); border: 1px solid #e3deff; color: #fff; display: grid; place-items: center; font: 500 20px var(--font-legacy); }
.account .name { font: 12px var(--font-legacy); color: #111; width: 54px; }

.body-row { flex: 1 1 auto; display: flex; min-height: 0; }
.menu { flex: none; width: 207px; border-right: 1px solid var(--border); background: var(--page); overflow-y: auto; }
.menu-group { display: flex; flex-direction: column; gap: 4px; padding: 4px 8px; }
.menu-store { padding: 8px 16px; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); font: 14px var(--font-legacy); color: #000; }
.menu-sep { border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
.mi { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 4px 0 8px; border-radius: 8px; width: 100%; text-align: left; font-size: 14px; line-height: 17px; letter-spacing: .1px; color: #000; }
.mi:hover { background: var(--depression); }
.mi.active { background: var(--selected); }
.mi .lbl { flex: 1 1 auto; white-space: nowrap; }
.shell.collapsed .menu { width: 61px; }
.shell.collapsed .mi .lbl, .shell.collapsed .mi .chev, .shell.collapsed .menu-store { display: none; }
.shell.collapsed .collapse img { transform: scaleX(-1); }

.main { flex: 1 1 auto; min-width: 0; overflow-y: auto; display: flex; flex-direction: column; align-items: center; padding: 32px 10px; gap: 16px; }
.main > :first-child { margin-top: auto; }
.main > :last-child { margin-bottom: auto; }

/* ---------- Cards ---------- */
.box { width: 566px; max-width: 100%; border: 1px solid var(--border); border-radius: 16px; padding: 32px; display: flex; flex-direction: column; gap: 24px; background: var(--page); }
.box.tinted { background: var(--elevation); }
.box.center { align-items: center; text-align: center; }
.title-l { margin: 0; font-size: 28px; line-height: 34px; font-weight: 700; color: var(--heading); text-wrap: balance; }
.body-m { margin: 0; font-size: 16px; line-height: 20px; color: var(--body); }
.features { display: flex; flex-direction: column; gap: 20px; padding: 0 32px; }
.feature { display: flex; align-items: center; gap: 16px; }
.feature .icon-dot { width: 44px; height: 44px; border-radius: 1000px; background: var(--depression); display: grid; place-items: center; flex: none; }
.feature b { display: block; color: var(--heading); font-size: 14px; line-height: 17px; margin-bottom: 4px; }
.feature span { font-size: 14px; line-height: 17px; }
.btn-big { height: 48px; width: 100%; border-radius: 8px; background: var(--action); color: #fff; font-weight: 700; font-size: 14px; line-height: 17px; letter-spacing: .1px; }
.btn-big:hover { background: #166282; }
.legal { font-size: 14px; line-height: 17px; color: #000; }
.legal button { text-decoration: underline; color: #000; }

/* ---------- Embedded onboarding ---------- */
.close-row { display: flex; justify-content: flex-end; }
.xbtn { width: 36px; height: 36px; border: 1px solid var(--border-input); border-radius: 4px; display: grid; place-items: center; }
.xbtn:hover { background: var(--depression); }
.form { display: flex; flex-direction: column; gap: 40px; padding: 4px; }
.form.tight { gap: 24px; }
.ob-head { display: flex; flex-direction: column; gap: 24px; }
.progress { position: relative; align-self: flex-start; }
.progress-btn { display: flex; align-items: center; gap: 6px; border-radius: 8px; padding: 2px 4px 2px 0; font-weight: 600; color: var(--heading); }
.progress-btn:hover { background: var(--depression); }
.progress-menu { position: absolute; z-index: 5; top: calc(100% + 6px); left: 0; width: 240px; background: var(--page); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 8px 24px rgba(29, 26, 26, .12); padding: 6px; display: flex; flex-direction: column; }
.progress-menu button { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; text-align: left; }
.progress-menu button:hover:not(:disabled) { background: var(--depression); }
.progress-menu button:disabled { cursor: default; color: var(--placeholder); }
.progress-menu .cur { font-weight: 600; color: var(--heading); }
.step-dot { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid #c9ced4; flex: none; display: grid; place-items: center; }
.step-dot.done { background: var(--action); border-color: var(--action); }
.step-dot.cur { border-color: var(--action); border-width: 4px; }
.h-xl { margin: 0; font-size: 28px; line-height: 36px; letter-spacing: .42px; font-weight: 700; color: var(--heading); text-wrap: balance; }
.p-md { margin: 0; font-size: 16px; line-height: 24px; color: var(--body); }

.field { display: flex; flex-direction: column; gap: 4px; }
.lbl-t { font-weight: 600; font-size: 14px; line-height: 20px; color: var(--heading); }
.in, .sel, .ta { width: 100%; min-height: 38px; padding: 8px; border: 1px solid var(--border); border-radius: 4px; background: var(--page); font: 14px/20px var(--font); color: var(--heading); }
.in::placeholder, .ta::placeholder { color: var(--placeholder); }
.in:focus, .sel:focus, .ta:focus { outline: none; border-color: #0196ed; box-shadow: 0 0 0 3px rgba(1, 150, 237, .25); }
.invalid, .invalid:focus { border-color: var(--danger) !important; }
.invalid:focus { box-shadow: 0 0 0 3px rgba(222, 31, 31, .2); }
.sel { appearance: none; -webkit-appearance: none; padding-right: 28px; background-image: url("assets/icons/arrow-up-down.svg"); background-repeat: no-repeat; background-position: right 9px center; background-size: 12px 12px; cursor: pointer; }
.sel.strong { font-weight: 600; }
.sel.ph { color: var(--heading); }
.ta { min-height: 117px; padding: 4px 8px; resize: vertical; }
.in.dob { width: 158px; padding: 4px 8px; min-height: 30px; }
.help { margin: 0; padding-top: 4px; font-size: 14px; line-height: 20px; color: var(--body); }
.help .lnk, .lnk { color: var(--action-text); font-weight: 600; }
.err { margin: 0; font-size: 12px; line-height: 16px; color: var(--danger); }
.phone { display: flex; align-items: center; min-height: 30px; border: 1px solid var(--border); border-radius: 4px; background: var(--page); overflow: hidden; }
.phone:focus-within { border-color: #0196ed; box-shadow: 0 0 0 3px rgba(1, 150, 237, .25); }
.phone.invalid:focus-within { box-shadow: 0 0 0 3px rgba(222, 31, 31, .2); }
.phone .cc { display: flex; align-items: center; gap: 6px; padding: 4px 8px; flex: none; }
.phone .pre { padding-left: 8px; color: var(--heading); flex: none; }
.phone input { flex: 1 1 auto; min-width: 0; border: 0; outline: 0; padding: 4px 8px 4px 6px; font: 14px/20px var(--font); color: var(--heading); background: transparent; }
.phone input::placeholder { color: var(--placeholder); }
.btns { display: flex; flex-direction: column; gap: 6px; }
.btn { width: 100%; padding: 8px; border-radius: 4px; border: 1px solid var(--action); font-weight: 600; font-size: 14px; line-height: 20px; }
.btn.primary { background: var(--action); color: #fff; }
.btn.primary:hover { background: #166282; }
.btn.secondary { background: var(--page); color: var(--action-text); }
.btn.secondary:hover { background: #f1f7fa; }
.btn[aria-busy="true"] { opacity: .75; cursor: progress; }
.spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255, 255, 255, .45); border-top-color: #fff; border-radius: 50%; vertical-align: -2px; margin-right: 8px; animation: spin .8s linear infinite; }
.spinner.dark { border-color: rgba(27, 123, 162, .25); border-top-color: var(--action); }
@keyframes spin { to { transform: rotate(360deg); } }
.banner { display: flex; gap: 10px; align-items: flex-start; padding: 12px; border-radius: 8px; background: var(--danger-bg); color: #8f1414; border: 1px solid #f5c2c2; }
.banner b { color: #8f1414; }

/* Payout */
.bank-search { display: flex; align-items: center; gap: 8px; padding: 8px; border: 1px solid var(--border); border-radius: 4px; }
.bank-search input { flex: 1; border: 0; outline: 0; font: 14px/20px var(--font); color: var(--heading); min-width: 0; }
.bank-search input::placeholder { color: var(--placeholder); }
.bank-search:focus-within { border-color: #0196ed; box-shadow: 0 0 0 3px rgba(1, 150, 237, .25); }
.banks { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.bank { position: relative; height: 74px; border: 1px solid rgba(60, 66, 87, .12); border-radius: 4px; background: var(--page); box-shadow: 0 2px 5px rgba(48, 49, 61, .08), 0 1px 1px rgba(0, 0, 0, .12); display: grid; place-items: center; overflow: hidden; }
.bank:hover { border-color: var(--action); }
.bank.sel-on { border: 2px solid var(--action); }
.bank .chk { position: absolute; top: 6px; right: 6px; width: 18px; height: 18px; border-radius: 50%; background: var(--action); display: grid; place-items: center; }
.bank-empty { grid-column: 1 / -1; padding: 12px; text-align: center; color: var(--body); border: 1px dashed var(--border); border-radius: 4px; }
.linkbtn { align-self: flex-start; color: var(--action-text); font-size: 14px; line-height: 20px; }
.linkbtn:hover { text-decoration: underline; }
.manual { display: flex; flex-direction: column; gap: 16px; padding: 16px; border: 1px solid var(--border); border-radius: 8px; }
.manual-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.selected-acct { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 8px; background: #f1f7fa; border: 1px solid #cfe3ec; }
.selected-acct .t { flex: 1; min-width: 0; }

/* Link popup */
.lk { width: 396px; max-width: 100%; height: min(704px, calc(100vh - 32px)); background: #fff; border-radius: 24px; box-shadow: 0 24px 60px rgba(0, 0, 0, .28); display: flex; flex-direction: column; overflow: hidden; font-family: var(--font); color: #1d1d1d; }
.lk-head { position: relative; flex: none; display: flex; justify-content: center; align-items: center; padding: 20px 68px 4px; min-height: 76px; }
.lk-logo { display: inline-flex; align-items: center; gap: 4px; font-weight: 700; font-size: 28px; line-height: 1; letter-spacing: -.8px; color: #011e0f; }
.lk-x { position: absolute; right: 18px; top: 18px; width: 40px; height: 40px; border-radius: 50%; background: #f2f2f2; display: grid; place-items: center; }
.lk-x:hover { background: #e6e6e6; }
.lk-body { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 20px; padding: 12px 20px 22px; overflow-y: auto; }
.lk-pair { display: flex; justify-content: center; gap: 14px; }
.lk-pair img { width: 72px; height: 72px; border-radius: 14px; box-shadow: 0 0 0 1px rgba(0, 0, 0, .06); }
.lk-sq { width: 72px; height: 72px; border-radius: 14px; background: #00D66F; display: grid; place-items: center; }
.lk-title { margin: 0; text-align: center; font-size: 26px; line-height: 34px; font-weight: 600; letter-spacing: -.3px; color: #1d1d1d; text-wrap: balance; }
.lk-points { display: flex; flex-direction: column; gap: 16px; padding: 0 6px; }
.lk-pt { display: flex; gap: 16px; align-items: flex-start; }
.lk-ico { width: 50px; height: 50px; border-radius: 50%; background: #f2f2f2; display: grid; place-items: center; flex: none; }
.lk-pt b { display: block; font-weight: 500; font-size: 17px; line-height: 24px; color: #1d1d1d; }
.lk-pt > div > span { display: block; color: #5f6368; font-size: 15px; line-height: 22px; }
.lk-pt > div > span.lk-dark { color: #1d1d1d; font-size: 16px; line-height: 24px; }
.lk-foot { margin-top: auto; display: flex; flex-direction: column; gap: 14px; align-items: stretch; text-align: center; }
.lk-fine { margin: 0; font-size: 13px; line-height: 18px; color: #5f6368; }
.lk-fine button { text-decoration: underline; color: #5f6368; }
.lk-btn { height: 56px; border-radius: 28px; background: #1d1d1d; color: #fff; font-size: 17px; font-weight: 500; }
.lk-btn:hover { background: #000; }
.lk-btn:disabled { background: #c4c4c4; cursor: not-allowed; }
.lk-sub { align-self: center; font-size: 13px; text-decoration: underline; color: #3c4043; }
.lk-plain { align-self: center; font-size: 17px; font-weight: 500; color: #1d1d1d; padding: 6px 12px; border-radius: 8px; }
.lk-plain:hover { background: #f2f2f2; }
.lk-bankicon { align-self: center; width: 72px; height: 72px; border-radius: 16px; border: 1px solid var(--border); display: grid; place-items: center; overflow: hidden; background: #fff; flex: none; }
.lk-bankicon img { width: 66px; height: auto; }
.lk-list { display: flex; flex-direction: column; border-radius: 12px; overflow: hidden; background: #f2f2f2; flex: none; }
.lk-row { display: flex; align-items: center; gap: 12px; padding: 14px 18px; text-align: left; border-bottom: 1px solid #e3e3e3; }
.lk-row:last-child { border-bottom: 0; }
.lk-row:hover { background: #eaeaea; }
.lk-row .t { flex: 1; min-width: 0; }
.lk-row b { display: block; font-weight: 500; font-size: 17px; line-height: 24px; color: #1d1d1d; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lk-row .n { color: #6b6b6b; font-size: 15px; line-height: 20px; }
.lk-row .ck { width: 20px; height: 20px; display: grid; place-items: center; flex: none; }
.lk-field { background: #f2f2f2; border: 2px solid transparent; border-radius: 12px; padding: 8px 16px; display: flex; flex-direction: column; text-align: left; }
.lk-field:focus-within { background: #fff; border-color: #1d1d1d; }
.lk-field.bad { border-color: var(--danger); background: #fff; }
.lk-field label { font-size: 13px; line-height: 18px; color: #5f6368; }
.lk-field input { border: 0; outline: 0; background: transparent; font: 17px/24px var(--font); color: #1d1d1d; padding: 0; width: 100%; }
.lk-phone { flex-direction: row; align-items: center; gap: 12px; padding-left: 8px; }
.lk-cc { display: flex; align-items: center; gap: 8px; padding: 10px; background: #fff; border-radius: 8px; box-shadow: 0 1px 3px rgba(0, 0, 0, .15); font-size: 15px; flex: none; }
.lk-err { margin: -12px 0 0; font-size: 13px; line-height: 18px; color: var(--danger); text-align: left; }
.lk-center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; }
.lk-center h2 { margin: 0; font-size: 26px; line-height: 32px; font-weight: 600; color: #1d1d1d; }
.lk-center p { margin: 0; color: #5f6368; font-size: 16px; line-height: 24px; max-width: 260px; }
.lk-ok { width: 64px; height: 64px; border-radius: 50%; background: #00D66F; display: grid; place-items: center; margin-bottom: 4px; }
/* Inline payout account chooser */
.chooser { display: flex; flex-direction: column; gap: 16px; }
.chooser-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.chooser-t { margin: 0; font-size: 20px; line-height: 28px; font-weight: 600; color: var(--heading); }
.accts { display: flex; flex-direction: column; gap: 12px; }
@media (max-width: 640px) { .lk { height: calc(100vh - 32px); } }

/* Statement preview */
.stmt { position: relative; padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 8px; background: url("assets/icons/stmt-bg.svg") no-repeat 0 0 / 100% 100%; font: 11px/16px var(--font-mono); color: var(--body); margin-top: 4px; }
.stmt .row { display: flex; align-items: center; gap: 12px; }
.stmt .bar { height: 12px; background: var(--badge); border-bottom: 1px solid var(--border); flex: none; }
.stmt .rule { height: 0; border-top: 1px solid var(--border); }
.stmt .grow { flex: 1; min-width: 0; }
.stmt .hl { color: var(--action-text); text-transform: uppercase; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stmt .amt-strong { color: var(--heading); }

/* Review */
.sec { display: flex; flex-direction: column; gap: 8px; }
.sec-title { display: flex; align-items: flex-end; gap: 8px; }
.sec-title p { flex: 1; margin: 0; font-weight: 600; font-size: 16px; line-height: 24px; color: var(--heading); }
.rcard { border: 1px solid var(--border); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.rcard-head { display: flex; align-items: center; gap: 12px; }

function prettyDob(v) {
  const m = String(v).replace(/\D/g, '');
  if (m.length !== 8) return v;
  const dt = new Date(+m.slice(4), +m.slice(0, 2) - 1, +m.slice(2, 4));
  return dt.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
}

/* ---------- Validation ---------- */
const digits = (s) => String(s || '').replace(/\D/g, '');
function validate(step) {
  const d = S.d, e = {};
  if (step === 'business-type') {
    if (!d.businessType) e.businessType = 'Select a business type.';
  }
  if (step === 'personal') {
    if (!d.firstName.trim() && !d.lastName.trim()) e.name = 'Enter your first and last name.';
    else if (!d.firstName.trim()) e.name = 'Enter your first name.';
    else if (!d.lastName.trim()) e.name = 'Enter your last name.';
    if (!d.email.trim()) e.email = 'Enter your email address.';
    else if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(d.email.trim())) e.email = 'Enter a valid email address, like name@example.com.';
    const dob = digits(d.dob);
    if (dob.length !== 8) e.dob = 'Enter your date of birth as MM / DD / YYYY.';
    else {
      const mm = +dob.slice(0, 2), dd = +dob.slice(2, 4), yy = +dob.slice(4);
      const dt = new Date(yy, mm - 1, dd);
      if (dt.getMonth() !== mm - 1 || dt.getDate() !== dd || yy < 1900) e.dob = 'Enter a real date of birth.';
      else { const age = (Date.now() - dt) / 31557600000; if (age < 18) e.dob = 'You must be at least 18 years old to open a payments account.'; }
    }
    if (!d.street.trim()) { e.address = 'Enter a street address.'; e._field = 'street'; }
    else if (!d.city.trim()) { e.address = 'Enter a city.'; e._field = 'city'; }
    else if (!d.state) { e.address = 'Select a state.'; e._field = 'state'; }
    else if (!/^\d{5}$/.test(d.zip.trim())) { e.address = 'Enter a 5-digit zip code.'; e._field = 'zip'; }
    if (digits(d.phone).length !== 10) e.phone = 'Enter a 10-digit US phone number.';
  }
  if (step === 'business') {
    if (!d.industry) e.industry = 'Select the industry that best matches what you sell.';
    if (d.website.trim() && !/^(https?:\/\/)?([\w-]+\.)+[a-z]{2,}(\/\S*)?$/i.test(d.website.trim())) e.website = 'Enter a valid website, like www.example.com.';
    if (d.description.trim().length < 10) e.description = 'Describe what you sell in at least 10 characters.';
  }
  if (step === 'payout') {
    if (d.manual) {
      if (!d.holder.trim()) e.holder = 'Enter the name on the bank account.';
      if (!/^\d{9}$/.test(d.routing.trim())) e.routing = 'Routing numbers have 9 digits.';
      if (!/^\d{4,17}$/.test(d.account.trim())) e.account = 'Account numbers have 4 to 17 digits.';
      else if (d.account.trim() !== d.account2.trim()) e.account2 = 'The account numbers don’t match.';
    } else if (!d.bank || !d.linked.length) e.payout = 'Select your bank, or enter your bank details manually.';
  }
  if (step === 'public') {
    const s = d.descriptor.trim();
    if (s.length < 5 || s.length > 22) e.descriptor = 'Use 5 to 22 characters.';
    else if (!/[a-z]/i.test(s)) e.descriptor = 'Include at least one letter.';
    else if (/[<>\\'"*]/.test(s)) e.descriptor = 'Remove these characters: < > \\ \' " *';
    if (digits(d.supportPhone).length !== 10) e.supportPhone = 'Enter a 10-digit US phone number.';
  }
  return e;
}

      <div class="lk-bankicon"><img src="${BANKS_DIR}bank-${b.id}.svg" width="66" alt="${esc(b.name)}"></div>
      <h2 class="lk-title" id="lk-t">Select accounts</h2>
      <div class="lk-list">${LK_ACCTS.map((a, i) => `<button class="lk-row" role="checkbox" aria-checked="${m.sel[i]}" data-lkacct="${i}"><span class="t"><b>${esc(a.name)}</b><span class="n">••••${a.last4}</span></span><span class="ck">${m.sel[i] ? SVG_CHECK('#1d1d1d') : ''}</span></button>`).join('')}</div>
      <div class="lk-foot">
        <p class="lk-fine">Linga can access account details. <button data-toast="Linga only reads account names, numbers and balances to set up payouts.">Learn more</button></p>
        <button class="lk-btn" data-act="lk-connect" id="lk-first"${n ? '' : ' disabled'}>${n > 1 ? 'Connect accounts' : 'Connect account'}</button>
      </div>`;
    }
    if (m.phase === 'save') inner = `
      <h2 class="lk-title" id="lk-t">Save account with Link</h2>
      <div class="lk-points">
        <div class="lk-pt"><span class="lk-ico">${SVG_CHAIN}</span><div><span class="lk-dark">Connect your account faster everywhere Link is accepted.</span></div></div>
        <div class="lk-pt"><span class="lk-ico">${SVG_LOCK}</span><div><span class="lk-dark">Link saves and encrypts your data from account setup, including bank and personal details.</span></div></div>
      </div>
      <div class="lk-field${m.err.email ? ' bad' : ''}"><label for="lk-email">Email address</label><input id="lk-email" data-lk="email" type="email" autocomplete="email" value="${esc(m.email)}"></div>
      ${m.err.email ? `<p class="lk-err" role="alert">${m.err.email}</p>` : ''}
      <div class="lk-field lk-phone${m.err.phone ? ' bad' : ''}"><span class="lk-cc">${SVG_FLAG} +1</span><span style="display:flex;flex-direction:column;flex:1;min-width:0"><label for="lk-phone">Phone number</label><input id="lk-phone" data-lk="phone" data-fmt="phone" type="tel" autocomplete="tel-national" value="${esc(m.phone)}"></span></div>
      ${m.err.phone ? `<p class="lk-err" role="alert">${m.err.phone}</p>` : ''}
      <div class="lk-foot">
        <p class="lk-fine">By saving your account, you agree to the<br>Link <button data-toast="Link’s Terms and Privacy Policy open in a new tab in the live product.">Terms and Privacy Policy</button></p>
        <button class="lk-btn" data-act="lk-save" id="lk-first">Save with Link</button>
        <button class="lk-plain" data-act="lk-skip">Finish without saving</button>
      </div>`;
    if (m.phase === 'success') inner = `
      <div class="lk-center"><span class="lk-ok">${SVG_CHECK('#011E0F', 28)}</span><h2 id="lk-t">Success</h2>
      <p>${m.saved ? 'Your accounts are connected and saved with Link.' : 'Your accounts are connected.'}</p></div>
      <div class="lk-foot"><button class="lk-btn" data-act="lk-done" id="lk-first">Done</button></div>`;
    const busy = m.phase === 'loading' || m.phase === 'saving';
    html = `<div class="scrim" data-act="scrim"><div class="lk" role="dialog" aria-modal="true" aria-labelledby="lk-t" aria-busy="${busy}">
      <div class="lk-head"><span class="lk-logo">${LK_MARK}<span>link</span></span>${busy || m.phase === 'success' ? '' : `<button class="lk-x" data-act="modal-close" aria-label="Close">${ic('close', 22)}</button>`}</div>
      <div class="lk-body">${inner}</div></div></div>`;
  }
  const r = route();
  const inForm = Object.keys(STEP_FIELDS).includes(r);
  const panel = S.protoOpen ? `<div class="proto-panel" role="menu">
      <span class="cap">Prototype</span>
      <button data-goto="start">Go to start page</button>
      <button data-act="restart">Restart onboarding with sample data</button>
      ${inForm ? '<button data-act="clear-step">Clear fields on this step</button>' : ''}
      <label><input type="checkbox" id="fail-next" ${S.failNext ? 'checked' : ''}> Fail the next submission</label>
      <span class="cap">Jump to</span>
      ${['payments', ...FLOW, 'done'].map((s) => `<button data-jump="${s}">${s === 'payments' ? 'Accept payments' : s === 'done' ? 'Confirmation' : LABEL[s]}</button>`).join('')}
    </div>` : '';
  html += `<div class="proto">${panel}<button class="proto-toggle" data-act="proto" aria-expanded="${S.protoOpen}">Prototype</button></div>`;
  if (S.toast) html += `<div class="toast" role="status">${esc(S.toast)}</div>`;
  layer.innerHTML = html;
  if (m && m.type === 'leave') document.getElementById('keep-btn')?.focus();
  if (m && m.type === 'link' && m.focus) { m.focus = false; document.getElementById('lk-first')?.focus(); }
}

let toastTimer;
function toast(msg) {
  S.toast = msg; renderLayer();
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { S.toast = ''; renderLayer(); }, 2800);
}

function filterBanks() {
  const q = (document.getElementById('f-banksearch')?.value || '').trim().toLowerCase();
  let shown = 0;
  document.querySelectorAll('#bank-grid .bank').forEach((t) => { const on = !q || t.dataset.name.includes(q); t.hidden = !on; if (on) shown++; });
  const empty = document.getElementById('bank-empty'); if (empty) empty.hidden = shown > 0;
}

/* ---------- Actions ---------- */
function next(step) {
  const errs = validate(step);
  if (Object.keys(errs).filter((k) => k !== '_field').length) {
    S.errors = errs; render();
    const first = document.querySelector('.invalid');
    (first?.matches('input,select,textarea') ? first : first?.querySelector('input,select,textarea'))?.focus();
    first?.scrollIntoView({ block: 'center', behavior: 'smooth' });
    return;
  }
  S.done.add(step);
  if (S.returnToReview) { S.returnToReview = false; go('review'); return; }
  go(FLOW[FLOW.indexOf(step) + 1]);
}

function submit() {
  S.submitting = true; S.submitError = ''; render();
  setTimeout(() => {
    S.submitting = false;
    if (S.failNext) { S.failNext = false; S.submitError = 'We couldn’t verify the date of birth for John Parker. Check it matches a government ID, then submit again.'; render(); document.querySelector('.banner')?.scrollIntoView({ block: 'center', behavior: 'smooth' }); return; }
    S.done.add('review'); S.completed = true; go('done');
  }, 1300);
}

document.addEventListener('click', (ev) => {
  const t = ev.target.closest('button, [data-act], label');
  if (!t) { if (S.progressOpen) { S.progressOpen = false; render(); } return; }
  const act = t.dataset.act;

  if (S.progressOpen && act !== 'progress' && !t.closest('.progress-menu')) { S.progressOpen = false; render(); }
  if (t.dataset.toast) { toast(t.dataset.toast); return; }
  if (t.dataset.goto) { go(t.dataset.goto); return; }
  if (t.dataset.jump) { S.protoOpen = false; go(t.dataset.jump); return; }
  if (t.dataset.edit) { S.returnToReview = true; go(t.dataset.edit); return; }
  if (t.dataset.bank) { S.modal = { type: 'link', bank: t.dataset.bank, phase: 'consent', sel: LK_ACCTS.map(() => true), email: S.d.email, phone: S.d.phone, err: {}, saved: false, focus: true }; renderLayer(); return; }
  if (t.dataset.lkacct) { const m = S.modal; m.sel[+t.dataset.lkacct] = !m.sel[+t.dataset.lkacct]; renderLayer(); document.querySelector(`[data-lkacct="${t.dataset.lkacct}"]`)?.focus(); return; }

  switch (act) {
    case 'scrim': if (ev.target === t && !(S.modal && ['loading', 'saving'].includes(S.modal.phase))) { S.modal = null; renderLayer(); } break;
    case 'continue': next(route()); break;
    case 'back': {
      const i = FLOW.indexOf(route());
      go(i > 0 ? FLOW[i - 1] : 'payments'); break;
    }
    case 'close': S.modal = { type: 'leave' }; renderLayer(); break;
    case 'modal-close': S.modal = null; renderLayer(); break;
    case 'leave': S.modal = null; S.d = defaults(); S.done = new Set(); S.returnToReview = false; go('payments'); break;
    case 'progress': S.progressOpen = !S.progressOpen; render(); break;
    case 'collapse':
      if (window.matchMedia('(max-width: 900px)').matches) S.menuOpen = !S.menuOpen; else S.collapsed = !S.collapsed;
      render(); break;
    case 'nav-payments': go(S.completed ? 'manage' : 'payments'); break;
    case 'manual-on': S.d.manual = true; S.errors = {}; render(); document.getElementById('f-holder')?.focus(); break;
    case 'manual-off': S.d.manual = false; S.errors = {}; render(); break;
    case 'lk-agree': {
      const m = S.modal; m.phase = 'loading'; renderLayer();
      setTimeout(() => { if (S.modal === m) { m.phase = 'accounts'; m.focus = true; renderLayer(); } }, 1100);
      break;
    }
    case 'lk-manual': S.modal = null; S.d.manual = true; S.errors = {}; render(); document.getElementById('f-holder')?.focus(); break;
    case 'lk-connect': { const m = S.modal; if (m.sel.some(Boolean)) { m.phase = 'save'; m.focus = true; renderLayer(); } break; }
    case 'lk-save': {
      const m = S.modal; m.err = {};
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(m.email.trim())) m.err.email = 'Enter a valid email address, like name@example.com.';
      if (digits(m.phone).length !== 10) m.err.phone = 'Enter a 10-digit US phone number.';
      if (Object.keys(m.err).length) { renderLayer(); document.querySelector('.lk-field.bad input')?.focus(); break; }
      m.phase = 'saving'; renderLayer();
      setTimeout(() => { if (S.modal === m) { m.phase = 'success'; m.saved = true; m.focus = true; renderLayer(); } }, 900);
      break;
    }
    case 'lk-skip': { const m = S.modal; m.phase = 'success'; m.saved = false; m.focus = true; renderLayer(); break; }
    case 'lk-done': {
      const m = S.modal;
      S.d.bank = m.bank; S.d.manual = false; S.d.linked = LK_ACCTS.filter((_, i) => m.sel[i]); S.d.payoutAcct = 0;
      S.modal = null; delete S.errors.payout; render();
      document.querySelector('input[name="payoutAcct"]')?.focus();
      break;
    }
    case 'bank-reset': S.d.bank = null; S.d.linked = []; S.d.payoutAcct = 0; render(); break;
    case 'submit': if (!S.submitting) submit(); break;
    case 'proto': S.protoOpen = !S.protoOpen; renderLayer(); break;
    case 'restart': S.protoOpen = false; S.d = defaults(); S.done = new Set(); S.completed = false; go('payments'); break;
    case 'clear-step': {
      const r = route();
      (STEP_FIELDS[r] || []).forEach((k) => { S.d[k] = k === 'bank' ? null : ''; });
      if (r === 'payout') { S.d.manual = false; S.d.linked = []; }
      S.protoOpen = false; S.errors = {}; render(); toast('Fields cleared. Press Continue to see the error messages.');
      break;
    }
  }
});

document.addEventListener('change', (ev) => {
  if (ev.target.id === 'fail-next') { S.failNext = ev.target.checked; return; }
  if (ev.target.name === 'payoutAcct') { S.d.payoutAcct = +ev.target.value; return; }
  if (ev.target.dataset.k && ev.target.tagName === 'SELECT') setField(ev.target);
});
document.addEventListener('input', (ev) => {
  const el = ev.target;
  if (el.id === 'f-banksearch') { filterBanks(); return; }
  if (!el.dataset.k && !el.dataset.lk) return;
  if (el.dataset.fmt === 'phone') {
    const v = digits(el.value).slice(0, 10);
    el.value = v.length > 6 ? `(${v.slice(0, 3)}) ${v.slice(3, 6)}-${v.slice(6)}` : v.length > 3 ? `(${v.slice(0, 3)}) ${v.slice(3)}` : v;
  }
  if (el.dataset.fmt === 'dob' && ev.inputType !== 'deleteContentBackward') {
    const v = digits(el.value).slice(0, 8);
    el.value = [v.slice(0, 2), v.slice(2, 4), v.slice(4)].filter(Boolean).join(' / ');
  }
  if (el.dataset.lk) { S.modal[el.dataset.lk] = el.value; if (S.modal.err[el.dataset.lk]) { delete S.modal.err[el.dataset.lk]; el.closest('.lk-field')?.classList.remove('bad'); el.closest('.lk-field')?.nextElementSibling?.matches('.lk-err') && el.closest('.lk-field').nextElementSibling.remove(); } return; }
  setField(el);
  if (el.dataset.k === 'descriptor') { const live = document.getElementById('stmt-live'); if (live) live.textContent = el.value || 'Example'; }
});
function setField(el) {
  S.d[el.dataset.k] = el.value;
  const e = el.dataset.e;
  if (e && S.errors[e]) {
    delete S.errors[e];
    document.querySelectorAll(`[data-e="${e}"]`).forEach((n) => { n.classList.remove('invalid'); n.removeAttribute('aria-invalid'); n.removeAttribute('aria-describedby'); });
    document.getElementById('err-' + e)?.remove();
  }
}
document.addEventListener('keydown', (ev) => {
  if (ev.key !== 'Escape') return;
  if (S.modal && !['loading', 'saving'].includes(S.modal.phase)) { S.modal = null; renderLayer(); }
  else if (S.progressOpen) { S.progressOpen = false; render(); }
  else if (S.protoOpen) { S.protoOpen = false; renderLayer(); }
});

window.addEventListener('hashchange', () => { S.errors = {}; render(); document.getElementById('main')?.scrollTo(0, 0); window.scrollTo(0, 0); });
render();
})();
</script>
