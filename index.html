<title>Linga Payments Prototype</title>
<meta name="description" content="Clickable prototype of the Linga back office with white-label payments onboarding.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto:wght@400;500&display=swap">
<style>
/* Layout: Linga back-office shell (74px top bar + 206px menu) around a centered 566px onboarding card, built from the Figma tokens.
   Single light theme on purpose: it mirrors the Linga back office in Figma. */
:root {
  --page: #ffffff;
  --heading: #1d1a1a;
  --body: #322f2f;
  --placeholder: #6a6a6a;
  --muted: #5d6976;
  --border: #e0e0e0;
  --border-input: #adaaaa;
  --action: #1b7ba2;
  --action-text: #166282;
  --selected: #a4cada;
  --depression: #f2f0f0;
  --elevation: #f7f9fd;
  --badge: #f5f5f5;
  --danger: #de1f1f;
  --danger-bg: #fdecec;
  --success: #2a7f05;
  --upload: #008600;
  --avatar: #6954ff;
  --scrim: rgba(29, 26, 26, 0.48);
  --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --font-legacy: "Roboto", "Inter", system-ui, Arial, sans-serif;
  --font-mono: Menlo, ui-monospace, "SFMono-Regular", Consolas, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--page); color: var(--body); font-family: var(--font); font-size: 14px; line-height: 20px; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
a { color: inherit; }
img { display: block; max-width: none; }
:focus-visible { outline: 2px solid var(--action); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

#app { height: 100%; }

/* ---------- Start page ---------- */
.start { min-height: 100%; display: flex; flex-direction: column; align-items: center; padding-block: 56px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--elevation); }
.start-inner { width: 100%; max-width: 980px; display: flex; flex-direction: column; gap: 32px; }
.start-head { display: flex; flex-direction: column; gap: 12px; }
.start-head h1 { margin: 0; font-size: 32px; line-height: 40px; color: var(--heading); text-wrap: balance; }
.start-head p { margin: 0; font-size: 16px; line-height: 24px; max-width: 62ch; }
.eyebrow { font-size: 12px; line-height: 16px; letter-spacing: .08em; text-transform: uppercase; color: var(--action-text); font-weight: 600; }
.paths { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.path { display: flex; flex-direction: column; gap: 12px; text-align: left; padding: 24px; background: var(--page); border: 1px solid var(--border); border-radius: 16px; transition: border-color .15s, box-shadow .15s; }
.path:hover { border-color: var(--action); box-shadow: 0 2px 8px rgba(27, 123, 162, .12); }
.path h2 { margin: 0; font-size: 18px; line-height: 24px; color: var(--heading); }
.path p { margin: 0; color: var(--body); }
.path .meta { margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-top: 8px; }
.path .go { font-weight: 600; color: var(--action-text); }
.path .icon-dot { width: 44px; height: 44px; border-radius: 1000px; background: var(--depression); display: grid; place-items: center; }
.pill { display: inline-flex; align-items: center; padding: 1px 6px; border-radius: 4px; font-size: 12px; line-height: 16px; background: var(--badge); color: var(--body); white-space: nowrap; }
.pill.ready { background: #e6f2ea; color: #1d5e2a; }
.pill.pending { background: #fff2e5; color: #994f01; }
.start-note { font-size: 13px; color: var(--muted); }

/* ---------- Shell ---------- */
.shell { height: 100%; display: flex; flex-direction: column; }
.topbar { flex: none; height: 74px; display: flex; align-items: center; padding-right: 20px; border-bottom: 1px solid var(--border); background: var(--page); }
.collapse { width: 61px; height: 100%; display: grid; place-items: center; border-right: 1px solid var(--border); flex: none; }
.brand { width: 171px; height: 74px; display: grid; place-items: center; flex: none; }
.loc { display: flex; align-items: center; gap: 10px; padding-left: 11px; flex: none; }
.loc-select { display: flex; align-items: center; justify-content: space-between; width: 252px; height: 39px; padding: 0 17px 0 12px; border: 1px solid var(--border-input); border-radius: 4px; font-size: 16px; line-height: 20px; color: var(--body); }
.flex-space { flex: 1 1 0; min-width: 8px; }
.actions { display: flex; align-items: center; gap: 16px; flex: none; }
.search { display: flex; align-items: center; gap: 8px; width: 213px; height: 36px; padding: 0 9px 0 10px; border: 1px solid var(--action); border-radius: 4px; color: var(--muted); font-size: 16px; }
.kbd { margin-left: auto; height: 22px; padding: 0 6px; display: flex; align-items: center; border: 1px solid #dddfe2; background: #f5f5f5; border-radius: 7px; font: 12px var(--font-legacy); color: var(--muted); white-space: nowrap; }
.notif { position: relative; width: 36px; height: 36px; }
.notif img { position: absolute; left: 0; top: -10px; }
.sq { width: 36px; height: 36px; border: 1px solid var(--action); border-radius: 4px; display: grid; place-items: center; }
.upgrade { height: 36px; width: 81px; border: 1px solid var(--action); border-radius: 4px; font: 500 14px var(--font-legacy); color: var(--action-text); }
.upload { width: 36px; height: 36px; border-radius: 4px; background: var(--upload); display: grid; place-items: center; box-shadow: 2px 2px 3px rgba(0, 0, 0, .19); }
.account { display: flex; align-items: center; gap: 10px; }
.account .div { width: 1px; height: 40px; background: var(--border); }
.avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--avatar); border: 1px solid #e3deff; color: #fff; display: grid; place-items: center; font: 500 20px var(--font-legacy); }
.account .name { font: 12px var(--font-legacy); color: #111; width: 54px; }

.body-row { flex: 1 1 auto; display: flex; min-height: 0; }
.menu { flex: none; width: 207px; border-right: 1px solid var(--border); background: var(--page); overflow-y: auto; }
.menu-group { display: flex; flex-direction: column; gap: 4px; padding: 4px 8px; }
.menu-store { padding: 8px 16px; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); font: 14px var(--font-legacy); color: #000; }
.menu-sep { border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
.mi { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 4px 0 8px; border-radius: 8px; width: 100%; text-align: left; font-size: 14px; line-height: 17px; letter-spacing: .1px; color: #000; }
.mi:hover { background: var(--depression); }
.mi.active { background: var(--selected); }
.mi .lbl { flex: 1 1 auto; white-space: nowrap; }
.shell.collapsed .menu { width: 61px; }
.shell.collapsed .mi .lbl, .shell.collapsed .mi .chev, .shell.collapsed .menu-store { display: none; }
.shell.collapsed .collapse img { transform: scaleX(-1); }

.main { flex: 1 1 auto; min-width: 0; overflow-y: auto; display: flex; flex-direction: column; align-items: center; padding: 32px 10px; gap: 16px; }
.main > :first-child { margin-top: auto; }
.main > :last-child { margin-bottom: auto; }

/* ---------- Cards ---------- */
.box { width: 566px; max-width: 100%; border: 1px solid var(--border); border-radius: 16px; padding: 32px; display: flex; flex-direction: column; gap: 24px; background: var(--page); }
.box.tinted { background: var(--elevation); }
.box.center { align-items: center; text-align: center; }
.title-l { margin: 0; font-size: 28px; line-height: 34px; font-weight: 700; color: var(--heading); text-wrap: balance; }
.body-m { margin: 0; font-size: 16px; line-height: 20px; color: var(--body); }
.features { display: flex; flex-direction: column; gap: 20px; padding: 0 32px; }
.feature { display: flex; align-items: center; gap: 16px; }
.feature .icon-dot { width: 44px; height: 44px; border-radius: 1000px; background: var(--depression); display: grid; place-items: center; flex: none; }
.feature b { display: block; color: var(--heading); font-size: 14px; line-height: 17px; margin-bottom: 4px; }
.feature span { font-size: 14px; line-height: 17px; }
.btn-big { height: 48px; width: 100%; border-radius: 8px; background: var(--action); color: #fff; font-weight: 700; font-size: 14px; line-height: 17px; letter-spacing: .1px; }
.btn-big:hover { background: #166282; }
.legal { font-size: 14px; line-height: 17px; color: #000; }
.legal button { text-decoration: underline; color: #000; }

/* ---------- Embedded onboarding ---------- */
.close-row { display: flex; justify-content: flex-end; }
.xbtn { width: 36px; height: 36px; border: 1px solid var(--border-input); border-radius: 4px; display: grid; place-items: center; }
.xbtn:hover { background: var(--depression); }
.form { display: flex; flex-direction: column; gap: 40px; padding: 4px; }
.form.tight { gap: 24px; }
.ob-head { display: flex; flex-direction: column; gap: 24px; }
.progress { position: relative; align-self: flex-start; }
.progress-btn { display: flex; align-items: center; gap: 6px; border-radius: 8px; padding: 2px 4px 2px 0; font-weight: 600; color: var(--heading); }
.progress-btn:hover { background: var(--depression); }
.progress-menu { position: absolute; z-index: 5; top: calc(100% + 6px); left: 0; width: 240px; background: var(--page); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 8px 24px rgba(29, 26, 26, .12); padding: 6px; display: flex; flex-direction: column; }
.progress-menu button { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; text-align: left; }
.progress-menu button:hover:not(:disabled) { background: var(--depression); }
.progress-menu button:disabled { cursor: default; color: var(--placeholder); }
.progress-menu .cur { font-weight: 600; color: var(--heading); }
.step-dot { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid #c9ced4; flex: none; display: grid; place-items: center; }
.step-dot.done { background: var(--action); border-color: var(--action); }
.step-dot.cur { border-color: var(--action); border-width: 4px; }
.h-xl { margin: 0; font-size: 28px; line-height: 36px; letter-spacing: .42px; font-weight: 700; color: var(--heading); text-wrap: balance; }
.p-md { margin: 0; font-size: 16px; line-height: 24px; color: var(--body); }

.field { display: flex; flex-direction: column; gap: 4px; }
.lbl-t { font-weight: 600; font-size: 14px; line-height: 20px; color: var(--heading); }
.in, .sel, .ta { width: 100%; min-height: 38px; padding: 8px; border: 1px solid var(--border); border-radius: 4px; background: var(--page); font: 14px/20px var(--font); color: var(--heading); }
.in::placeholder, .ta::placeholder { color: var(--placeholder); }
.in:focus, .sel:focus, .ta:focus { outline: none; border-color: #0196ed; box-shadow: 0 0 0 3px rgba(1, 150, 237, .25); }
.invalid, .invalid:focus { border-color: var(--danger) !important; }
.invalid:focus { box-shadow: 0 0 0 3px rgba(222, 31, 31, .2); }
.sel { appearance: none; -webkit-appearance: none; padding-right: 28px; background-image: url("assets/icons/arrow-up-down.svg"); background-repeat: no-repeat; background-position: right 9px center; background-size: 12px 12px; cursor: pointer; }
.sel.strong { font-weight: 600; }
.sel.ph { color: var(--heading); }
.ta { min-height: 117px; padding: 4px 8px; resize: vertical; }
.in.dob { width: 158px; padding: 4px 8px; min-height: 30px; }
.help { margin: 0; padding-top: 4px; font-size: 14px; line-height: 20px; color: var(--body); }
.help .lnk, .lnk { color: var(--action-text); font-weight: 600; }
.err { margin: 0; font-size: 12px; line-height: 16px; color: var(--danger); }
.phone { display: flex; align-items: center; min-height: 30px; border: 1px solid var(--border); border-radius: 4px; background: var(--page); overflow: hidden; }
.phone:focus-within { border-color: #0196ed; box-shadow: 0 0 0 3px rgba(1, 150, 237, .25); }
.phone.invalid:focus-within { box-shadow: 0 0 0 3px rgba(222, 31, 31, .2); }
.phone .cc { display: flex; align-items: center; gap: 6px; padding: 4px 8px; flex: none; }
.phone .pre { padding-left: 8px; color: var(--heading); flex: none; }
.phone input { flex: 1 1 auto; min-width: 0; border: 0; outline: 0; padding: 4px 8px 4px 6px; font: 14px/20px var(--font); color: var(--heading); background: transparent; }
.phone input::placeholder { color: var(--placeholder); }
.btns { display: flex; flex-direction: column; gap: 6px; }
.btn { width: 100%; padding: 8px; border-radius: 4px; border: 1px solid var(--action); font-weight: 600; font-size: 14px; line-height: 20px; }
.btn.primary { background: var(--action); color: #fff; }
.btn.primary:hover { background: #166282; }
.btn.secondary { background: var(--page); color: var(--action-text); }
.btn.secondary:hover { background: #f1f7fa; }
.btn[aria-busy="true"] { opacity: .75; cursor: progress; }
.spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255, 255, 255, .45); border-top-color: #fff; border-radius: 50%; vertical-align: -2px; margin-right: 8px; animation: spin .8s linear infinite; }
.spinner.dark { border-color: rgba(27, 123, 162, .25); border-top-color: var(--action); }
@keyframes spin { to { transform: rotate(360deg); } }
.banner { display: flex; gap: 10px; align-items: flex-start; padding: 12px; border-radius: 8px; background: var(--danger-bg); color: #8f1414; border: 1px solid #f5c2c2; }
.banner b { color: #8f1414; }

/* Payout */
.bank-search { display: flex; align-items: center; gap: 8px; padding: 8px; border: 1px solid var(--border); border-radius: 4px; }
.bank-search { background: var(--page); cursor: text; }
.bank-search img { flex: none; }
.bank-search input { flex: 1; min-width: 0; height: 20px; margin: 0; padding: 0; border: 0; outline: 0; border-radius: 0; background: transparent; box-shadow: none; -webkit-appearance: none; appearance: none; color-scheme: light; font: 14px/20px var(--font); letter-spacing: -0.15px; color: var(--heading); }
.bank-search input::-webkit-search-decoration, .bank-search input::-webkit-search-cancel-button { -webkit-appearance: none; display: none; }
.bank-search input::placeholder { color: var(--placeholder); }
.bank-search:focus-within { border-color: #0196ed; box-shadow: 0 0 0 3px rgba(1, 150, 237, .25); }
.banks { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.bank { position: relative; height: 74px; border: 1px solid rgba(60, 66, 87, .12); border-radius: 4px; background: var(--page); box-shadow: 0 2px 5px rgba(48, 49, 61, .08), 0 1px 1px rgba(0, 0, 0, .12); display: grid; place-items: center; overflow: hidden; }
.bank:hover { border-color: var(--action); }
.bank.sel-on { border: 2px solid var(--action); }
.bank .chk { position: absolute; top: 6px; right: 6px; width: 18px; height: 18px; border-radius: 50%; background: var(--action); display: grid; place-items: center; }
.bank-empty { grid-column: 1 / -1; padding: 12px; text-align: center; color: var(--body); border: 1px dashed var(--border); border-radius: 4px; }
.linkbtn { align-self: flex-start; color: var(--action-text); font-size: 14px; line-height: 20px; }
.linkbtn:hover { text-decoration: underline; }
.manual { display: flex; flex-direction: column; gap: 16px; padding: 16px; border: 1px solid var(--border); border-radius: 8px; }
.manual-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.selected-acct { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 8px; background: #f1f7fa; border: 1px solid #cfe3ec; }
.selected-acct .t { flex: 1; min-width: 0; }

/* Manage · Transactions */
.main.page { align-items: stretch; padding: 32px; gap: 28px; }
.main.page > :first-child, .main.page > :last-child { margin: 0; }
.crumbs { display: flex; align-items: center; flex-wrap: wrap; font: 16px/1.5 var(--font-legacy); letter-spacing: .15px; color: var(--placeholder); }
.crumbs span:not(.cur-crumb) { width: 23px; text-align: center; }
.crumbs button { color: var(--placeholder); }
.crumbs button:hover { text-decoration: underline; }
.cur-crumb { color: #282828; }
.pg-title { margin: 0; font-weight: 500; font-size: 32px; line-height: 38px; color: #000; }
.pbox { border: 1px solid var(--border); border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.pbox-t { margin: 0; font-weight: 500; font-size: 20px; line-height: 24px; color: #000; }
.bal-row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.bal-row > div:first-child { flex: 1; min-width: 0; }
.bal-lbl { font-weight: 600; font-size: 16px; line-height: 24px; color: var(--body); }
.bal-big { font-weight: 700; font-size: 24px; line-height: 32px; letter-spacing: .36px; color: var(--heading); font-variant-numeric: tabular-nums; }
.bal-btns { display: flex; gap: 8px; }
.bal-meta { display: flex; gap: 40px; flex-wrap: wrap; }
.bal-sm { font-size: 14px; line-height: 20px; color: var(--body); }
.bal-md { font-weight: 600; font-size: 16px; line-height: 24px; color: var(--heading); display: flex; gap: 8px; align-items: center; }
.lnk-md { color: var(--action-text); font-weight: 600; font-size: 16px; }
.lnk-md:hover { text-decoration: underline; }
.btn.auto { width: auto; padding: 7px 8px; }
.btn:disabled:not([aria-busy]) { border-color: var(--border); color: #938f8f; background: #fff; cursor: not-allowed; }
.tx-wrap { display: flex; flex-direction: column; gap: 16px; padding: 8px; min-width: 0; }
.tabs.left .tab { flex: none; }
.tx-actions { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chipwrap { position: relative; }
.chip { padding: 3px 8px; border: 1px solid var(--border); border-radius: 4px; font-weight: 600; font-size: 14px; line-height: 20px; color: var(--body); background: #fff; }
.chip:hover { border-color: var(--action); }
.chip.on { border-color: var(--action); color: var(--action-text); background: #f1f7fa; }
.fpop { position: absolute; z-index: 20; top: calc(100% + 6px); left: 0; min-width: 220px; background: #fff; border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 8px 24px rgba(29, 26, 26, .12); padding: 6px; display: flex; flex-direction: column; }
.fopt { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; cursor: pointer; white-space: nowrap; }
.fopt:hover { background: var(--depression); }
.fopt input { accent-color: var(--action); margin: 0; }
.fpop .linkbtn { padding: 6px 8px; }
.tbl-scroll { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; line-height: 20px; font-variant-numeric: tabular-nums; }
.tbl th { text-align: left; font-weight: 700; font-size: 12px; color: var(--body); height: 36px; padding: 0 24px 0 0; border-bottom: 1px solid var(--border); white-space: nowrap; }
.tbl td { height: 36px; padding: 0 24px 0 0; border-bottom: 1px solid var(--border); color: var(--heading); white-space: nowrap; }
.tbl .grow { width: 100%; }
.tbl .r { text-align: right; padding-right: 0; }
.tbl td.r b { font-weight: 600; }
.tbl .cur { display: inline-block; width: 35px; text-align: right; color: var(--body); }
.tbl tbody tr[data-act] { cursor: pointer; }
.tbl tbody tr[data-act]:hover td { background: #f7f9fd; }
.tbl tbody tr:focus-visible { outline: 2px solid var(--action); outline-offset: -2px; }
.tbl .empty td { padding: 24px 0; text-align: center; color: var(--body); white-space: normal; }
.tx-foot { display: flex; align-items: center; gap: 16px; justify-content: space-between; flex-wrap: wrap; }
.tx-foot b { font-weight: 600; }
.pager { display: flex; gap: 8px; }
.pill.ok { background: #e9f2e6; color: #226604; }
.pill.warn { background: #fff2e5; color: #994f01; }
.pill.bad { background: #f9e0e0; color: #8f1414; }
.subs { display: flex; flex-direction: column; gap: 4px; padding-left: 28px; }
.smi { height: 28px; padding: 0 8px; border-radius: 8px; text-align: left; font-size: 14px; line-height: 17px; color: #000; }
.smi:hover { background: var(--depression); }
.smi.active { background: var(--selected); }
.shell.collapsed .subs { display: none; }
.banner-box { flex-direction: row; align-items: center; gap: 16px; flex-wrap: wrap; }
.bb-t { flex: 1; min-width: 240px; display: flex; flex-direction: column; gap: 4px; }
.bb-t b { font-weight: 600; font-size: 16px; line-height: 24px; color: var(--heading); }
.bb-t span { font-size: 14px; line-height: 20px; color: var(--body); }
.chip.on { display: inline-flex; align-items: center; padding: 0; }
.chip-x { display: grid; place-items: center; width: 24px; height: 28px; padding-left: 4px; }
.chip-x img { opacity: .8; }
.chip-l { display: inline-flex; align-items: center; gap: 0; padding: 3px 8px 3px 2px; font-weight: 600; color: var(--heading); }
.chip-v { margin-left: 6px; padding-left: 6px; border-left: 1px solid #cfe3ec; color: var(--action-text); }
.tbl.sum th, .tbl.sum td { padding-right: 12px; }
.tbl.sum th:last-child, .tbl.sum td:last-child { padding-right: 0; }
.tbl.sum th:first-child, .tbl.sum td:first-child { width: 100%; }
.tbl.sum tr.tot td { border-bottom: 1px solid var(--border); }
.ptx { list-style: none; margin: 0; padding: 0; }
.ptx li { border-bottom: 1px solid var(--border); }
.ptx button { display: flex; align-items: center; gap: 8px; width: 100%; padding: 10px 0; text-align: left; }
.ptx button:hover { background: #f7f9fd; }
.ptx button > span { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.ptx b { font-weight: 600; color: var(--heading); }

function prettyDob(v) {
  const m = String(v).replace(/\D/g, '');
  if (m.length !== 8) return v;
  const dt = new Date(+m.slice(4), +m.slice(0, 2) - 1, +m.slice(2, 4));
  return dt.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
}

/* ---------- Validation ---------- */
const digits = (s) => String(s || '').replace(/\D/g, '');
function validate(step) {
  const d = S.d, e = {};
  if (step === 'business-type') {
    if (!d.businessType) e.businessType = 'Select a business type.';
  }
  if (step === 'personal') {
    if (!d.firstName.trim() && !d.lastName.trim()) e.name = 'Enter your first and last name.';
    else if (!d.firstName.trim()) e.name = 'Enter your first name.';
    else if (!d.lastName.trim()) e.name = 'Enter your last name.';
    if (!d.email.trim()) e.email = 'Enter your email address.';
    else if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(d.email.trim())) e.email = 'Enter a valid email address, like name@example.com.';
    const dob = digits(d.dob);
    if (dob.length !== 8) e.dob = 'Enter your date of birth as MM / DD / YYYY.';
    else {
      const mm = +dob.slice(0, 2), dd = +dob.slice(2, 4), yy = +dob.slice(4);
      const dt = new Date(yy, mm - 1, dd);
      if (dt.getMonth() !== mm - 1 || dt.getDate() !== dd || yy < 1900) e.dob = 'Enter a real date of birth.';
      else { const age = (Date.now() - dt) / 31557600000; if (age < 18) e.dob = 'You must be at least 18 years old to open a payments account.'; }
    }
    if (!d.street.trim()) { e.address = 'Enter a street address.'; e._field = 'street'; }
    else if (!d.city.trim()) { e.address = 'Enter a city.'; e._field = 'city'; }
    else if (!d.state) { e.address = 'Select a state.'; e._field = 'state'; }
    else if (!/^\d{5}$/.test(d.zip.trim())) { e.address = 'Enter a 5-digit zip code.'; e._field = 'zip'; }
    if (digits(d.phone).length !== 10) e.phone = 'Enter a 10-digit US phone number.';
  }
  if (step === 'business') {
    if (!d.industry) e.industry = 'Select the industry that best matches what you sell.';
    if (d.website.trim() && !/^(https?:\/\/)?([\w-]+\.)+[a-z]{2,}(\/\S*)?$/i.test(d.website.trim())) e.website = 'Enter a valid website, like www.example.com.';
    if (d.description.trim().length < 10) e.description = 'Describe what you sell in at least 10 characters.';
  }
  if (step === 'payout') {
    if (d.manual) {
      if (!d.holder.trim()) e.holder = 'Enter the name on the bank account.';
      if (!/^\d{9}$/.test(d.routing.trim())) e.routing = 'Routing numbers have 9 digits.';
      if (!/^\d{4,17}$/.test(d.account.trim())) e.account = 'Account numbers have 4 to 17 digits.';
      else if (d.account.trim() !== d.account2.trim()) e.account2 = 'The account numbers don’t match.';
    } else if (!d.bank || !d.linked.length) e.payout = 'Select your bank, or enter your bank details manually.';
  }
  if (step === 'public') {
    const s = d.descriptor.trim();
    if (s.length < 5 || s.length > 22) e.descriptor = 'Use 5 to 22 characters.';
    else if (!/[a-z]/i.test(s)) e.descriptor = 'Include at least one letter.';
    else if (/[<>\\'"*]/.test(s)) e.descriptor = 'Remove these characters: < > \\ \' " *';
    if (digits(d.supportPhone).length !== 10) e.supportPhone = 'Enter a 10-digit US phone number.';
  }
  return e;
}

function acAction(act, t) {
  const g = S.mg, a = g?.ac, m = S.modal, d = S.d;
  switch (act) {
    case 'ac-tab': a.tab = t.dataset.tab; g.pop = null; render(); document.querySelector('.rtab.on')?.focus(); return true;
    case 'ac-pop': g.pop = g.pop === t.dataset.k ? null : t.dataset.k; render(); document.querySelector('.fpop .fopt')?.focus(); return true;
    case 'ac-edit': {
      const sec = t.dataset.sec;
      if (sec === 'taxcode') { openModal('acedit', { sec, code: a.code }); return true; }
      const vals = {}; AC_EDIT[sec][1].forEach(([k]) => { vals[k] = d[k]; }); openModal('acedit', { sec, ...vals }); return true;
    }
    case 'ac-save': {
      if (m.sec === 'taxcode') { a.code = m.code; S.modal = null; render(); toast('Product tax code updated.'); return true; }
      const e = {}, v = (k) => String(m[k] ?? '').trim();
      AC_EDIT[m.sec][1].forEach(([k, l]) => { if (!v(k)) e[k] = `Enter ${l.toLowerCase()}.`; });
      if (m.website !== undefined && v('website') && !/^(https?:\/\/)?([\w-]+\.)+[a-z]{2,}(\/\S*)?$/i.test(v('website'))) e.website = 'Enter a valid website, like www.example.com.';
      ['phone', 'supportPhone'].forEach((k) => { if (m[k] !== undefined && digits(m[k]).length !== 10) e[k] = 'Enter a 10-digit US phone number.'; });
      if (m.email !== undefined && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v('email'))) e.email = 'Enter a valid email address, like name@example.com.';
      if (m.descriptor !== undefined && (v('descriptor').length < 5 || v('descriptor').length > 22)) e.descriptor = 'Use 5 to 22 characters.';
      if (m.zip !== undefined && !/^\d{5}$/.test(v('zip'))) e.zip = 'Enter a 5-digit zip code.';
      if (Object.keys(e).length) { m.err = e; renderLayer(); document.querySelector('.mdl .invalid')?.focus(); return true; }
      AC_EDIT[m.sec][1].forEach(([k]) => { d[k] = v(k); });
      S.modal = null; render(); toast(`${m.sec === 'person' ? 'Representative' : AC_EDIT[m.sec][0]} updated.`); return true;
    }
    case 'ac-pm': { const [on, note] = a.pm[t.dataset.id]; openModal('acpm', { id: t.dataset.id, on, note, domain: d.website }); return true; }
    case 'ac-pm-save': {
      if (m.id === 'googlepay' && m.note && m.on && !/^(https?:\/\/)?([\w-]+\.)+[a-z]{2,}(\/\S*)?$/i.test(String(m.domain || '').trim())) { m.err = { domain: 'Enter the website where customers pay, like www.example.com.' }; renderLayer(); return true; }
      const name = PM_GROUPS.flatMap((x) => x[2]).find((x) => x[0] === m.id)[1];
      a.pm[m.id] = [!!m.on, m.id === 'googlepay' && m.note && m.on ? '' : a.pm[m.id][1]]; S.modal = null; render(); toast(`${name} is ${m.on ? 'on' : 'off'}.`); return true;
    }
    case 'ac-acc': a.open[t.dataset.k] = !a.open[t.dataset.k]; render(); return true;
    case 'ac-regtab': a.regTab = t.dataset.tab; a.regPg = 0; render(); return true;
    case 'ac-thtab': a.thTab = t.dataset.tab; render(); return true;
    case 'ac-reg-prev': a.regPg = Math.max(0, a.regPg - 1); render(); return true;
    case 'ac-reg-next': a.regPg += 1; render(); return true;
    case 'ac-reg-end': case 'ac-reg-renew': case 'ac-reg-rm': {
      const r = a.regs.find((x) => x.id === t.dataset.id); g.pop = null;
      if (act === 'ac-reg-rm') { a.regs = a.regs.filter((x) => x !== r); toast(`${r.loc} registration removed.`); }
      else { r.status = act === 'ac-reg-end' ? 'Expired' : 'Active'; if (r.status === 'Active') r.start = 'November 2, 2026'; toast(`${r.loc} registration ${act === 'ac-reg-end' ? 'ended' : 'reactivated'}.`); }
      render(); return true;
    }
    case 'ac-reg-add': openModal('acreg', { country: 'United States', region: t.dataset.loc || '', start: '2026-11-02', regno: '' }); return true;
    case 'ac-reg-save': {
      const e = {};
      if (!m.region) e.region = `Select a ${m.country === 'Canada' ? 'province' : 'state'}.`;
      else if (a.regs.some((r) => r.loc === m.region && r.status === 'Active')) e.region = `You already have an active registration in ${m.region}.`;
      if (!m.start) e.start = 'Choose a start date.';
      if (Object.keys(e).length) { m.err = e; renderLayer(); return true; }
      const [y, mo, da] = m.start.split('-').map(Number), when = new Date(y, mo - 1, da).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
      a.regs.unshift({ id: 'reg_' + Date.now(), loc: m.region, country: m.country, status: 'Active', start: when }); a.regTab = 'all'; a.regPg = 0;
      S.modal = null; render(); toast(`${m.region} registration added. Linga Tax collects tax there from ${when}.`); return true;
    }
    case 'ac-export':
      if (!a.exRange) { a.exErr = 'Select a date range.'; render(); document.getElementById('ac-range')?.focus(); return true; }
      a.exErr = ''; a.exBusy = true; render();
      setTimeout(() => { a.exBusy = false; render(); toast(`Tax transactions export started. We’ll email the CSV to ${S.d.email}.`); }, 1000);
      return true;
  }
  return false;
}

      ${kv(p.status === 'Paid' ? 'Date paid' : 'Date created', fTime(p.status === 'Paid' ? p.arrive : p.when))}${kv('Payout trace ID', `<span class="mono" style="font-size:13px">${p.trace}</span>`)}</section>

      ${p.refunds && refundTx ? `<li><button data-act="po-tx" data-id="${refundTx.id}"><span><b>Refund</b><small>${esc(refundTx.desc)} · ${esc(refundTx.name)}</small></span><b>${money(-p.refunds)}</b>${ic('chevron-forward', 20)}</button></li>` : ''}
    </ul><p class="help" style="padding:0">Showing ${items.length + (p.refunds ? 1 : 0)} of ${p.count + (p.refunds ? 1 : 0)} transactions in this payout. <button class="u" data-toast="The full list downloads with Export on the Payouts page.">View all</button></p></section>`);

      ${refunded < x.amount ? '<button class="btn primary" data-act="m-refund">Begin refund</button>' : `<p class="note">This payment was fully refunded on ${fDate(x.refunds[x.refunds.length - 1].when)}.</p>`}`,

  payout(m) {

    const amt = parseFloat(String(m.amount).replace(/[^0-9.]/g, '')) || 0, f = m.speed === 'instant' ? Math.round(amt * 2) / 100 : 0;

      <div class="field"><label class="lbl-t" for="m-amount">Amount</label>${mMoney('amount', 'Payout amount')}</div>
      <div class="kv"><span>${m.speed === 'instant' ? `Instant Payout fee (2%) <span class="info" tabindex="0" title="Instant payouts cost 2% of the amount." aria-label="Instant payouts cost 2% of the amount.">i</span>` : 'Standard payout fee'}</span><span id="m-fee">${money(f)}</span></div>
      <div class="btns"><button class="btn primary" data-act="m-payout-go"${m.busy ? ' aria-busy="true" disabled' : ''}>${m.busy ? spin('Paying out…') : 'Pay out'}</button></div>`);
  },
  dispute(m) {
    const d = m.d, x = d.tx, r = REASONS[d.reason], days = Math.ceil((d.due - new Date(2026, 10, 2)) / 86400000);
    const tag = d.status === 'Action required' ? `<span class="pill warn">Due in ${days} days</span>` : badge(d.status);
    const guide = m.guide ? `<ol class="guide"><li>Gather proof the customer authorized or received the purchase: receipts, signed checks, delivery or pickup records.</li><li>Answer three short questions and upload your evidence. Linga sends it to the customer’s bank.</li><li>The bank usually decides within 60–75 days. You’ll get an email when it does.</li></ol>` : '';
    const action = d.status === 'Action required'
      ? `<button class="linkbtn" data-act="guide-toggle" aria-expanded="${!!m.guide}">Step by step guide ${ic('chevron-down', 8, 8, m.guide ? 'flip' : '')}</button>${guide}
         <div class="two"><button class="btn primary" data-act="m-counter">Counter dispute</button><button class="btn secondary" data-act="m-accept">Accept dispute</button></div>`
      : d.status === 'In review' ? `<p class="note">You submitted evidence on ${fDate(d.submitted || new Date(2026, 10, 2))}. The bank usually decides within 60–75 days.</p>`
      : d.status === 'Dispute won' ? '<p class="note">The bank ruled in your favor. The disputed amount was returned to your balance.</p>'
      : d.status === 'Deadline missed' ? '<p class="note">The response deadline passed without evidence, so the bank ruled for the cardholder.</p>'
      : '<p class="note">This dispute is closed. The disputed amount and a $15.00 dispute fee were deducted from your balance.</p>';
    return mdl(`<div class="amt-h"><span class="amt-big" id="mdl-t">${money(x.amount)}</span><span class="amt-cur">USD</span></div><p class="mdl-sub">From ${esc(x.email)}</p>`,
    `<div class="dcard"><button class="dhead" data-act="dcard-toggle" aria-expanded="${!m.closed}">${ic('chevron-down', 8, 8, m.closed ? 'rot' : '')}<b>Disputed for ${money(d.amount)}</b>${tag}</button>
      ${m.closed ? '' : `<div class="dbody"><p>${r[1]}</p>${kv('Response due date', `${fDate(d.due)}, 7:59 PM`)}${kv('Reason', `<button class="u" data-toast="${esc(d.reason)}: ${esc(r[2])}">${esc(d.reason)}</button>`)}${kv('Network reason code', `<button class="u" data-toast="Card network reason code ${r[0]}.">${r[0]}</button>`)}${action}</div>`}</div>
    <section class="msec"><h3>Payment details</h3><div class="kv"><span>Status</span><span>${badge(d.status)}</span></div>${kv('Date received', fTime(x.when))}${kv('Amount', money(x.amount))}${kv('Amount disputed', money(d.amount))}${feeRows(x, m.feeOpen)}${kv('Net', money(x.amount - fee(x.amount)))}${kv('Description', esc(x.desc))}</section>
    ${methodSection(x)}
    ${timeline([...(d.submitted ? [['Evidence submitted', fTime(d.submitted)]] : []), ['Payment disputed', fTime(d.opened), `${esc(r[2])} <button class="u strong" data-toast="Disputes are explained in the Linga help center.">Learn more</button>`], ['Payment succeeded', fTime(x.when)], ['Payment started', fTime(new Date(x.when.getTime() - 4000))]])}`);
  },
  accept(m) {
    return mdl('<h2 class="mdl-t" id="mdl-t">Accept this dispute?</h2>',
    `<p style="margin:0">You’ll refund <b>${money(m.d.amount)}</b> to the cardholder and pay a <b>$15.00</b> dispute fee. You can’t counter the dispute after accepting it.</p>
     <div class="btns"><button class="btn primary" data-act="m-accept-go">Accept dispute</button><button class="btn secondary" data-act="m-back">Go back</button></div>`);
  },
  counter(m) {
    const steps = { 1: ['Tell us about the dispute', 'Your responses will help us collect the most relevant evidence to counter the customer’s claim.'], 2: ['Additional details', 'Provide additional information about your customer and your interaction with them so far to help with your claim.'], 3: ['Collect evidence', 'Based on your previous responses, we recommend submitting the following evidence to the customer’s bank.'], 4: ['Review and submit', 'Check your answers before sending them to the customer’s bank.'] };
    const [t, p] = steps[m.step];
    let body = '';
    if (m.step === 1) body = `<h3 class="h-sec">Why should you win this dispute?</h3>
      <div class="field"><span class="lbl-t">Choose the primary reason you believe the issuing bank should overturn this dispute.</span>${mRadios('why', ['The cardholder withdrew the dispute', 'The cardholder was refunded', 'The purchase was made by the rightful user', 'Other'])}</div>
      <h3 class="h-sec">Product or service details</h3>
      <div class="field"><label class="lbl-t" for="m-pdesc">Product description</label><textarea id="m-pdesc" class="ta${m.err.pdesc ? ' invalid' : ''}" data-m="pdesc" placeholder="Describe the product or service involved in this dispute.">${esc(m.pdesc)}</textarea>${mErr('pdesc')}</div>
      <div class="field"><span class="lbl-t">What type of product or service is this?</span>${mRadios('ptype', ['Physical product', 'Digital product or service', 'Offline service', 'Event', 'Booking or reservation', 'Other'])}</div>`;
    if (m.step === 2) body = `<h3 class="h-sec">Customer details</h3>
      <div class="field"><label class="lbl-t" for="m-cname">Name</label>${mIn('cname')}${mErr('cname')}</div>
      <div class="field"><label class="lbl-t" for="m-cemail">Email</label>${mIn('cemail', { ph: 'email@example.com', type: 'email' })}${mErr('cemail')}</div>
      <div class="field"><span class="lbl-t">Billing address</span>${mSel('ccountry', ['United States'], 'Country')}${mIn('cstreet', { ph: 'Street address', label: 'Street address' })}${mIn('cunit', { ph: 'Apartment, unit, or other', label: 'Apartment, unit, or other' })}${mIn('ccity', { ph: 'City', label: 'City' })}${mSel('cstate', [['', 'State'], ...STATES], 'State')}${mIn('czip', { ph: 'Zip code', mode: 'numeric', label: 'Zip code' })}${mErr('caddr')}</div>`;
    if (m.step === 3) body = `<h3 class="h-sec">Supporting files</h3>
      <div class="field"><span class="lbl-t">Upload evidence</span><p class="help" style="padding:0 0 8px">The following evidence is most relevant to this dispute: an itemized receipt, the signed check or card slip, and any messages with the customer. If you would like to share other types of evidence, upload it and label it as "Other evidence."</p>
        <label class="upbox${m.err.files ? ' invalid' : ''}"><input type="file" id="m-files" multiple accept=".jpg,.jpeg,.png,.pdf" hidden><span class="up-t">Upload</span><span>Upload files as a JPG, PDF, or PNG. The total size can’t exceed 4.5 MB.</span></label>
        ${m.files.length ? `<ul class="files">${m.files.map((f, i) => `<li><svg width="14" height="16" viewBox="0 0 14 16" aria-hidden="true"><path d="M2 .75h6.5L12.25 4.5V15.25H2z" fill="none" stroke="#322f2f" stroke-width="1.5" stroke-linejoin="round"/><path d="M8.25 1v3.75H12" fill="none" stroke="#322f2f" stroke-width="1.5"/></svg><span>${esc(f.name)}</span><small>${(f.size / 1024).toFixed(0)} KB</small><button class="mdl-x sm" data-act="file-rm" data-i="${i}" aria-label="Remove ${esc(f.name)}">${ic('close', 16)}</button></li>`).join('')}</ul>` : ''}${mErr('files')}</div>
      <div class="field"><label class="lbl-t" for="m-info">Additional information</label><p class="help" style="padding:0;font-size:12px;line-height:16px">Include any other information you'd like the customer's bank to consider when reviewing this dispute.</p>
        <textarea id="m-info" class="ta" data-m="info" placeholder="Describe the product or service involved in this dispute.">${esc(m.info)}</textarea></div>`;
    if (m.step === 4) body = `${banner(m.fail)}<section class="msec" style="padding-top:0">${kv('Why you should win', esc(m.why))}${kv('Product description', esc(m.pdesc))}${kv('Type', esc(m.ptype))}${kv('Customer', `${esc(m.cname)}<br>${esc(m.cemail)}`)}${kv('Billing address', `${esc(m.cstreet)}${m.cunit ? ', ' + esc(m.cunit) : ''}<br>${esc(m.ccity)}, ${esc(m.cstate)} ${esc(m.czip)}`)}${kv('Evidence', m.files.map((f) => esc(f.name)).join('<br>'))}${m.info ? kv('Additional information', esc(m.info)) : ''}</section>`;
    const primary = m.step === 4 ? (m.busy ? spin('Submitting…') : 'Submit evidence') : m.step === 3 ? 'Review' : 'Next';
    return mdl(`<p class="crumb-sm"><button class="lnkc" data-act="m-back">Counter a dispute</button> • <b>${m.step === 4 ? 'Review' : `Step ${m.step} of 3`}</b></p><h2 class="mdl-t" id="mdl-t">${t}</h2><p class="mdl-p">${p}</p>`,
      `${body}<div class="btns"><button class="btn primary" data-act="m-counter-next"${m.busy ? ' aria-busy="true" disabled' : ''}>${primary}</button><button class="btn secondary" data-act="${m.step > 1 ? 'm-counter-prev' : 'm-back'}">${m.step > 1 ? 'Back' : 'Cancel'}</button></div>`);
  },
};

function openModal(type, extra = {}) { S.modal = { type, err: {}, ...extra }; renderLayer(); document.querySelector('.mdl')?.scrollTo(0, 0); document.querySelector('.mdl-x')?.focus(); }
function payoutModal() { const b = S.mg.bal; openModal('payout', { speed: 'instant', amount: Math.min(514.89, b.available).toFixed(2), to: S.d.linked.length ? `${BANKS.find((x) => x.id === S.d.bank).name} ••••${S.d.linked[S.d.payoutAcct].last4}` : 'Wells Fargo ••••1234' }); }
function counterModal(d) {
  openModal('counter', { d, step: 1, why: 'The purchase was made by the rightful user', pdesc: `${d.tx.desc} at Naples store on ${fDate(d.tx.when)}. The guest dined in, signed the receipt and left a tip.`, ptype: 'Offline service',
    cname: d.tx.name, cemail: d.tx.email, ccountry: 'United States', cstreet: '880 Gulf Shore Blvd N', cunit: '', ccity: 'Naples', cstate: 'FL', czip: '34102',
    files: [{ name: `signed_receipt_${d.tx.id}.pdf`, size: 184320 }, { name: 'pos_order_ticket.png', size: 96256 }], info: 'Server notes and the POS order ticket show the card was present and the PIN was entered.' });
}
function mgAction(act, t) {
  if (!S.mg) S.mg = mgDefaults();
  const m = S.modal, g = S.mg;
  switch (act) {
    case 'mg-tab': g.tab = t.dataset.tab; g.pg[g.tab] = 0; g.pop = null; render(); document.querySelector('.tab.on')?.focus(); return true;
    case 'mg-prev': g.pg[fkey()] = Math.max(0, g.pg[fkey()] - 1); render(); return true;
    case 'mg-next': g.pg[fkey()] += 1; render(); return true;
    case 'filter': {
      const f = t.dataset.f, opts = FILTERS[fkey()].find(([n]) => n === f)[1];
      if (!opts) { toast(`Filtering by ${f.toLowerCase()} isn’t part of this prototype yet. Try Status.`); return true; }
      g.pop = g.pop === f ? null : f; render(); return true;
    }
    case 'filter-clear': delete g.filters[fkey()][t.dataset.f]; g.pg[fkey()] = 0; g.pop = null; render(); return true;
    case 'filter-reset': g.filters[fkey()] = {}; g.pop = null; g.pg[fkey()] = 0; render(); return true;
    case 'open-po': openModal('po', { p: g.payouts.find((y) => y.id === t.dataset.id) }); return true;
    case 'po-tx': { const x = g.tx.find((y) => y.id === t.dataset.id); openModal('payment', { tx: x, back: m }); return true; }
    case 'm-payout-instant': payoutModal(); return true;
    case 'sub-nav': go(t.dataset.to); return true;
    case 'rep-tab': g.rep.tab = t.dataset.tab; g.pop = null; render(); document.querySelector('.rtab.on')?.focus(); return true;
    case 'rep-pop': g.pop = g.pop === t.dataset.k ? null : t.dataset.k; render(); document.querySelector('.fpop .fopt.cur-opt')?.focus(); return true;
    case 'rep-set': g.rep[t.dataset.k] = t.dataset.v; g.pop = null; render(); return true;
    case 'rep-dl': {
      if (t.getAttribute('aria-busy')) return true;
      const M = REP_MONTHS[g.rep.month], name = `${t.dataset.id}_${M.file}.csv`;
      t.setAttribute('aria-busy', 'true'); t.innerHTML = '<span class="spinner dark" style="width:12px;height:12px;margin:0 6px 0 0"></span>Preparing';
      setTimeout(() => { render(); toast(`${t.dataset.t} for ${M.label.replace(' → ', '–')} is ready. We’ll email ${name} to ${S.fs.email || S.d.email}.`); }, 900);
      return true;
    }
    case 'open-tx': { const x = g.tx.find((y) => y.id === t.dataset.id); if (x.dispute) openModal('dispute', { d: x.dispute }); else openModal('payment', { tx: x }); return true; }
    case 'open-dp': openModal('dispute', { d: g.disputes.find((y) => y.id === t.dataset.id) }); return true;
    case 'm-payout': payoutModal(); return true;
    case 'm-balance': openModal('balance'); return true;
    case 'm-export': openModal('export', { range: 'today', cols: 'default', start: '2026-10-01', end: '2026-11-02' }); return true;
    case 'fee-toggle': m.feeOpen = !m.feeOpen; renderLayer(); return true;
    case 'guide-toggle': m.guide = !m.guide; renderLayer(); return true;
    case 'dcard-toggle': m.closed = !m.closed; renderLayer(); return true;
    case 'm-refund': { const x = m.tx, left = x.amount - x.refunds.reduce((a, r) => a + r.amount, 0); openModal('refund', { tx: x, amount: left.toFixed(2), max: left, reason: 'Requested by customer', note: '', back: m }); return true; }
    case 'm-back': { S.modal = m.back || (m.d ? { type: 'dispute', d: m.d, err: {} } : null); renderLayer(); return true; }
    case 'm-refund-go': {
      const a = parseFloat(String(m.amount).replace(/[^0-9.]/g, ''));
      m.err = {}; m.fail = '';
      if (!a || a <= 0) m.err.amount = 'Enter an amount greater than $0.00.';
      else if (a > m.max + 0.001) m.err.amount = `You can refund up to ${money(m.max)}.`;
      if (Object.keys(m.err).length) { renderLayer(); document.getElementById('m-amount')?.focus(); return true; }
      m.busy = true; renderLayer();
      setTimeout(() => {
        m.busy = false;
        if (S.failNext) { S.failNext = false; m.fail = 'The refund couldn’t be processed because your available balance is too low. Add funds or try a smaller amount.'; renderLayer(); return; }
        m.tx.refunds.push({ amount: a, reason: m.reason, when: new Date(2026, 10, 2, 14, 32) }); g.bal.available -= a;
        S.modal = { ...m.back, err: {} }; render(); toast(`Refund of ${money(a)} sent to ${m.tx.name}.`);
      }, 1100);
      return true;
    }
    case 'm-export-go': {
      m.err = {};
      if (m.range === 'custom' && (!m.start || !m.end || m.end < m.start)) { m.err.end = 'Choose an end date on or after the start date.'; renderLayer(); return true; }
      m.busy = true; renderLayer();
      setTimeout(() => { S.modal = null; renderLayer(); toast(`Export started. We’ll email the CSV to ${S.fs.email || S.d.email} in a few minutes.`); }, 1000);
      return true;
    }
    case 'm-payout-go': {
      const b = g.bal, cap = m.speed === 'instant' ? Math.min(514.89, b.available) : b.available, a = parseFloat(String(m.amount).replace(/[^0-9.]/g, ''));
      m.err = {}; m.fail = '';
      if (!a || a <= 0) m.err.amount = 'Enter an amount greater than $0.00.';
      else if (a > cap + 0.001) m.err.amount = m.speed === 'instant' ? `You can pay out up to ${money(cap)} instantly. Choose Standard to pay out more.` : `You can pay out up to ${money(cap)}.`;
      if (Object.keys(m.err).length) { renderLayer(); document.getElementById('m-amount')?.focus(); return true; }
      m.busy = true; renderLayer();
      setTimeout(() => {
        m.busy = false;
        if (S.failNext) { S.failNext = false; m.fail = `${m.to.split(' ••')[0]} declined this payout. Check your bank details in Payments › Account, or try a different account.`; renderLayer(); return; }
        const f = m.speed === 'instant' ? Math.round(a * 2) / 100 : 0;
        b.available -= a + f; b.onWay += a; m.sent = a; m.phase = 'done';
        g.payouts.unshift({ id: 'po_' + (9000 + g.payouts.length), when: new Date(2026, 10, 2, 15, 5), arrive: m.speed === 'instant' ? new Date(2026, 10, 2, 15, 35) : new Date(2026, 10, 4, 9, 0), amount: a, status: 'In transit', method: m.speed === 'instant' ? 'Instant' : 'Standard', count: 0, fees: 0, refunds: 0, trace: '20261102-LNG' + Math.floor(a * 1000).toString(36).toUpperCase() });
        render();
      }, 1100);
      return true;
    }
    case 'm-counter': counterModal(m.d); return true;
    case 'm-accept': openModal('accept', { d: m.d }); return true;
    case 'm-accept-go': m.d.status = 'Dispute lost'; g.bal.available -= 15; S.modal = { type: 'dispute', d: m.d, err: {} }; render(); toast('Dispute accepted. The cardholder has been refunded.'); return true;
    case 'm-counter-prev': m.step -= 1; m.err = {}; renderLayer(); document.querySelector('.mdl')?.scrollTo(0, 0); return true;
    case 'm-counter-next': {
      m.err = {};
      if (m.step === 1) { if (!m.why) m.err.why = 'Choose a reason.'; if ((m.pdesc || '').trim().length < 10) m.err.pdesc = 'Describe the product or service in at least 10 characters.'; if (!m.ptype) m.err.ptype = 'Choose the type of product or service.'; }
      if (m.step === 2) {
        if (!m.cname?.trim()) m.err.cname = 'Enter the customer’s name.';
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(m.cemail?.trim() || '')) m.err.cemail = 'Enter a valid email address, like name@example.com.';
        if (!m.cstreet?.trim() || !m.ccity?.trim() || !m.cstate || !/^\d{5}$/.test(m.czip || '')) m.err.caddr = 'Enter a full billing address with a 5-digit zip code.';
      }
      if (m.step === 3) { const size = m.files.reduce((a, f) => a + f.size, 0); if (!m.files.length) m.err.files = 'Upload at least one file to support your claim.'; else if (size > 4.5 * 1024 * 1024) m.err.files = 'These files add up to more than 4.5 MB. Remove one or upload smaller files.'; }
      if (Object.keys(m.err).length) { renderLayer(); document.querySelector('.mdl .invalid, .mdl .radios.bad input')?.focus(); return true; }
      if (m.step < 4) { m.step += 1; renderLayer(); document.querySelector('.mdl')?.scrollTo(0, 0); return true; }
      m.busy = true; renderLayer();
      setTimeout(() => {
        m.busy = false;
        if (S.failNext) { S.failNext = false; m.fail = 'The evidence couldn’t be sent. One of your files may be damaged. Remove it and try again.'; renderLayer(); return; }
        m.d.status = 'In review'; m.d.submitted = new Date(2026, 10, 2, 14, 40);
        S.modal = { type: 'dispute', d: m.d, err: {} }; render(); toast('Evidence submitted. The bank usually decides within 60–75 days.');
      }, 1300);
      return true;
    }
    case 'file-rm': m.files.splice(+t.dataset.i, 1); renderLayer(); return true;
  }
  return false;
}

      <div class="lk-bankicon"><img src="${BANKS_DIR}bank-${b.id}.svg" width="66" alt="${esc(b.name)}"></div>
      <h2 class="lk-title" id="lk-t">Select accounts</h2>
      <div class="lk-list">${LK_ACCTS.map((a, i) => `<button class="lk-row" role="checkbox" aria-checked="${m.sel[i]}" data-lkacct="${i}"><span class="t"><b>${esc(a.name)}</b><span class="n">••••${a.last4}</span></span><span class="ck">${m.sel[i] ? SVG_CHECK('#1d1d1d') : ''}</span></button>`).join('')}</div>
      <div class="lk-foot">
        <p class="lk-fine">Linga can access account details. <button data-toast="Linga only reads account names, numbers and balances to set up payouts.">Learn more</button></p>
        <button class="lk-btn" data-act="lk-connect" id="lk-first"${n ? '' : ' disabled'}>${n > 1 ? 'Connect accounts' : 'Connect account'}</button>
      </div>`;
    }
    if (m.phase === 'save') inner = `
      <h2 class="lk-title" id="lk-t">Save account with Link</h2>
      <div class="lk-points">
        <div class="lk-pt"><span class="lk-ico">${SVG_CHAIN}</span><div><span class="lk-dark">Connect your account faster everywhere Link is accepted.</span></div></div>
        <div class="lk-pt"><span class="lk-ico">${SVG_LOCK}</span><div><span class="lk-dark">Link saves and encrypts your data from account setup, including bank and personal details.</span></div></div>
      </div>
      <div class="lk-field${m.err.email ? ' bad' : ''}"><label for="lk-email">Email address</label><input id="lk-email" data-lk="email" type="email" autocomplete="email" value="${esc(m.email)}"></div>
      ${m.err.email ? `<p class="lk-err" role="alert">${m.err.email}</p>` : ''}
      <div class="lk-field lk-phone${m.err.phone ? ' bad' : ''}"><span class="lk-cc">${SVG_FLAG} +1</span><span style="display:flex;flex-direction:column;flex:1;min-width:0"><label for="lk-phone">Phone number</label><input id="lk-phone" data-lk="phone" data-fmt="phone" type="tel" autocomplete="tel-national" value="${esc(m.phone)}"></span></div>
      ${m.err.phone ? `<p class="lk-err" role="alert">${m.err.phone}</p>` : ''}
      <div class="lk-foot">
        <p class="lk-fine">By saving your account, you agree to the<br>Link <button data-toast="Link’s Terms and Privacy Policy open in a new tab in the live product.">Terms and Privacy Policy</button></p>
        <button class="lk-btn" data-act="lk-save" id="lk-first">Save with Link</button>
        <button class="lk-plain" data-act="lk-skip">Finish without saving</button>
      </div>`;
    if (m.phase === 'success') inner = `
      <div class="lk-center"><span class="lk-ok">${SVG_CHECK('#011E0F', 28)}</span><h2 id="lk-t">Success</h2>
      <p>${m.saved ? 'Your accounts are connected and saved with Link.' : 'Your accounts are connected.'}</p></div>
      <div class="lk-foot"><button class="lk-btn" data-act="lk-done" id="lk-first">Done</button></div>`;
    const busy = m.phase === 'loading' || m.phase === 'saving';
    html = `<div class="scrim" data-act="scrim"><div class="lk" role="dialog" aria-modal="true" aria-labelledby="lk-t" aria-busy="${busy}">
      <div class="lk-head"><span class="lk-logo">${LK_MARK}<span>link</span></span>${busy || m.phase === 'success' ? '' : `<button class="lk-x" data-act="modal-close" aria-label="Close">${ic('close', 22)}</button>`}</div>
      <div class="lk-body">${inner}</div></div></div>`;
  }
  const r = route();
  const inForm = Object.keys(STEP_FIELDS).includes(r);
  const panel = S.protoOpen ? `<div class="proto-panel" role="menu">
      <span class="cap">Prototype</span>
      <button data-goto="start">Go to start page</button>
      <button data-act="restart">Restart onboarding with sample data</button>
      ${inForm ? '<button data-act="clear-step">Clear fields on this step</button>' : ''}
      <label><input type="checkbox" id="fail-next" ${S.failNext ? 'checked' : ''}> Fail the next submission</label>
      <span class="cap">Jump to</span>
      ${(MODE() === 'fs' ? ['payments', 'account', ...FLOW, 'done'] : ['payments', ...FLOW, 'done']).map((s) => `<button data-jump="${s}">${s === 'payments' ? 'Accept payments' : s === 'done' ? 'Confirmation' : s === 'account' ? 'Create account / Login' : LABEL[s]}</button>`).join('')}
    </div>` : '';
  html += `<div class="proto">${panel}<button class="proto-toggle" data-act="proto" aria-expanded="${S.protoOpen}">Prototype</button></div>`;
  if (S.toast) html += `<div class="toast" role="status">${esc(S.toast)}</div>`;
  layer.innerHTML = html;
  if (m && m.type === 'leave') document.getElementById('keep-btn')?.focus();
  if (m && m.type === 'link' && m.focus) { m.focus = false; document.getElementById('lk-first')?.focus(); }
}

let toastTimer;
function toast(msg) {
  S.toast = msg; renderLayer();
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { S.toast = ''; renderLayer(); }, 2800);
}

function filterBanks() {
  const q = (document.getElementById('f-banksearch')?.value || '').trim().toLowerCase();
  let shown = 0;
  document.querySelectorAll('#bank-grid .bank').forEach((t) => { const on = !q || t.dataset.name.includes(q); t.hidden = !on; if (on) shown++; });
  const empty = document.getElementById('bank-empty'); if (empty) empty.hidden = shown > 0;
}

/* ---------- Actions ---------- */
function next(step) {
  const errs = validate(step);
  if (Object.keys(errs).filter((k) => k !== '_field').length) {
    S.errors = errs; render();
    const first = document.querySelector('.invalid');
    (first?.matches('input,select,textarea') ? first : first?.querySelector('input,select,textarea'))?.focus();
    first?.scrollIntoView({ block: 'center', behavior: 'smooth' });
    return;
  }
  DONE().add(step);
  if (S.returnToReview) { S.returnToReview = false; go('review'); return; }
  go(FLOW[FLOW.indexOf(step) + 1]);
}

function submit() {
  S.submitting = true; S.submitError = ''; render();
  setTimeout(() => {
    S.submitting = false;
    if (S.failNext) { S.failNext = false; S.submitError = 'We couldn’t verify the date of birth for John Parker. Check it matches a government ID, then submit again.'; render(); document.querySelector('.banner')?.scrollIntoView({ block: 'center', behavior: 'smooth' }); return; }
    DONE().add('review'); S.completed = true; go('done');
  }, 1300);
}

document.addEventListener('click', (ev) => {
  const t = ev.target.closest('button, [data-act], label');
  if (S.mg?.pop && !(t && t.closest('.chipwrap'))) { S.mg.pop = null; render(); if (!t) return; }
  if (!t) { if (S.progressOpen) { S.progressOpen = false; render(); } return; }
  const act = t.dataset.act;

  if (S.progressOpen && act !== 'progress' && !t.closest('.progress-menu')) { S.progressOpen = false; render(); }
  if (t.dataset.toast) { toast(t.dataset.toast); return; }
  if (t.dataset.goto) { go(t.dataset.goto); return; }
  if (t.dataset.jump) { S.protoOpen = false; go(t.dataset.jump); return; }
  if (act && (mgAction(act, t) || acAction(act, t))) return;
  if (t.dataset.edit) { S.returnToReview = true; go(t.dataset.edit); return; }
  if (t.dataset.bank) { S.modal = { type: 'link', bank: t.dataset.bank, phase: 'consent', sel: LK_ACCTS.map(() => true), email: S.d.email, phone: S.d.phone, err: {}, saved: false, focus: true }; renderLayer(); return; }
  if (t.dataset.lkacct) { const m = S.modal; m.sel[+t.dataset.lkacct] = !m.sel[+t.dataset.lkacct]; renderLayer(); document.querySelector(`[data-lkacct="${t.dataset.lkacct}"]`)?.focus(); return; }

  switch (act) {
    case 'scrim': if (ev.target === t && !(S.modal && (S.modal.busy || ['loading', 'saving'].includes(S.modal.phase)))) { S.modal = null; renderLayer(); } break;
    case 'continue': next(route()); break;
    case 'back': {
      const i = FLOW.indexOf(route());
      go(i > 0 ? FLOW[i - 1] : 'payments'); break;
    }
    case 'close': S.modal = { type: 'leave' }; renderLayer(); break;
    case 'modal-close': S.modal = null; renderLayer(); break;
    case 'leave':
      S.modal = null; S.d = defaults(); S.returnToReview = false;
      if (MODE() === 'fs') { S.doneFs = new Set(); S.fs = fsDefaults(); go('payments'); toast('You’re signed out.'); }
      else { S.done = new Set(); go('payments'); }
      break;
    case 'signout': S.modal = { type: 'leave', title: 'Sign out?' }; renderLayer(); break;
    case 'tab-create': case 'tab-login': S.fs.tab = act === 'tab-create' ? 'create' : 'login'; S.errors = {}; render(); document.querySelector('.tab.on')?.focus(); break;
    case 'pw-toggle': S.fs.show = !S.fs.show; render(); document.getElementById('fs-password')?.focus(); break;
    case 'fs-create': fsAuth('create'); break;
    case 'fs-login': fsAuth('login'); break;
    case 'progress': S.progressOpen = !S.progressOpen; render(); break;
    case 'collapse':
      if (window.matchMedia('(max-width: 900px)').matches) S.menuOpen = !S.menuOpen; else S.collapsed = !S.collapsed;
      render(); break;
    case 'nav-payments': if (showSub()) { S.paySub = !S.paySub; render(); document.querySelector('.mi[data-act=nav-payments]')?.focus(); } else go(S.completed ? 'manage' : 'payments'); break;
    case 'manual-on': S.d.manual = true; S.errors = {}; render(); document.getElementById('f-holder')?.focus(); break;
    case 'manual-off': S.d.manual = false; S.errors = {}; render(); break;
    case 'lk-agree': {
      const m = S.modal; m.phase = 'loading'; renderLayer();
      setTimeout(() => { if (S.modal === m) { m.phase = 'accounts'; m.focus = true; renderLayer(); } }, 1100);
      break;
    }
    case 'lk-manual': S.modal = null; S.d.manual = true; S.errors = {}; render(); document.getElementById('f-holder')?.focus(); break;
    case 'lk-connect': { const m = S.modal; if (m.sel.some(Boolean)) { m.phase = 'save'; m.focus = true; renderLayer(); } break; }
    case 'lk-save': {
      const m = S.modal; m.err = {};
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(m.email.trim())) m.err.email = 'Enter a valid email address, like name@example.com.';
      if (digits(m.phone).length !== 10) m.err.phone = 'Enter a 10-digit US phone number.';
      if (Object.keys(m.err).length) { renderLayer(); document.querySelector('.lk-field.bad input')?.focus(); break; }
      m.phase = 'saving'; renderLayer();
      setTimeout(() => { if (S.modal === m) { m.phase = 'success'; m.saved = true; m.focus = true; renderLayer(); } }, 900);
      break;
    }
    case 'lk-skip': { const m = S.modal; m.phase = 'success'; m.saved = false; m.focus = true; renderLayer(); break; }
    case 'lk-done': {
      const m = S.modal;
      S.d.bank = m.bank; S.d.manual = false; S.d.linked = LK_ACCTS.filter((_, i) => m.sel[i]); S.d.payoutAcct = 0;
      S.modal = null; delete S.errors.payout; render();
      document.querySelector('input[name="payoutAcct"]')?.focus();
      break;
    }
    case 'bank-reset': S.d.bank = null; S.d.linked = []; S.d.payoutAcct = 0; render(); break;
    case 'submit': if (!S.submitting) submit(); break;
    case 'proto': S.protoOpen = !S.protoOpen; renderLayer(); break;
    case 'restart': S.protoOpen = false; S.mg = null; S.d = defaults(); S.done = new Set(); S.doneFs = new Set(); S.fs = fsDefaults(); S.completed = false; go('payments'); break;
    case 'clear-step': {
      const r = route();
      (STEP_FIELDS[r] || []).forEach((k) => { S.d[k] = k === 'bank' ? null : ''; });
      if (r === 'payout') { S.d.manual = false; S.d.linked = []; }
      S.protoOpen = false; S.errors = {}; render(); toast('Fields cleared. Press Continue to see the error messages.');
      break;
    }
  }
});

document.addEventListener('change', (ev) => {
  if (ev.target.id === 'fail-next') { S.failNext = ev.target.checked; return; }
  if (ev.target.dataset.fopt) {
    const g = S.mg, f = ev.target.dataset.fopt, cur = new Set(g.filters[fkey()][f] || []);
    ev.target.checked ? cur.add(ev.target.value) : cur.delete(ev.target.value);
    g.filters[fkey()][f] = [...cur]; g.pg[fkey()] = 0; render(); document.querySelector(`[data-fopt="${f}"][value="${ev.target.value}"]`)?.focus(); return;
  }
  if (ev.target.id === 'm-files') {
    const m = S.modal; [...ev.target.files].forEach((f) => m.files.push({ name: f.name, size: f.size })); delete m.err.files; renderLayer(); return;
  }
  if (ev.target.dataset.ac) { const a = S.mg.ac, k = ev.target.dataset.ac; a[k] = ev.target.value; if (k === 'exRange') a.exErr = ''; render(); document.getElementById(ev.target.id)?.focus(); return; }
  if (ev.target.dataset.m && ev.target.type === 'checkbox') { S.modal[ev.target.dataset.m] = ev.target.checked; renderLayer(); document.querySelector(`[data-m="${ev.target.dataset.m}"]`)?.focus(); return; }
  if (ev.target.dataset.m && (ev.target.type === 'radio' || ev.target.tagName === 'SELECT')) {
    const m = S.modal, k = ev.target.dataset.m; m[k] = ev.target.value; delete m.err[k]; if (k.startsWith('c')) delete m.err.caddr;
    if (k === 'speed') { const b = S.mg.bal; m.amount = (k === 'speed' && ev.target.value === 'instant' ? Math.min(514.89, b.available) : b.available).toFixed(2); m.err = {}; }
    renderLayer(); document.querySelector(ev.target.type === 'radio' ? `input[name="m-${k}"][value="${CSS.escape(ev.target.value)}"]` : `#m-${k}`)?.focus(); return;
  }
  if (ev.target.name === 'payoutAcct') { S.d.payoutAcct = +ev.target.value; return; }
  if (ev.target.dataset.k && ev.target.tagName === 'SELECT') setField(ev.target);
});
document.addEventListener('input', (ev) => {
  const el = ev.target;
  if (el.id === 'f-banksearch') { filterBanks(); return; }
  if (el.dataset.ac) return;
  if (el.dataset.m && el.type !== 'radio' && el.type !== 'checkbox' && el.tagName !== 'SELECT') {
    const m = S.modal, k = el.dataset.m; m[k] = el.value;
    const ek = ['cstreet', 'cunit', 'ccity', 'czip'].includes(k) ? 'caddr' : k;
    if (m.err[ek]) { delete m.err[ek]; el.classList.remove('invalid'); el.closest('.money')?.classList.remove('invalid'); el.removeAttribute('aria-invalid'); document.getElementById('me-' + ek)?.remove(); }
    if (m.type === 'payout' && k === 'amount') { const a = parseFloat(el.value.replace(/[^0-9.]/g, '')) || 0; const fe = document.getElementById('m-fee'); if (fe) fe.textContent = money(m.speed === 'instant' ? Math.round(a * 2) / 100 : 0); }
    return;
  }
  if (el.dataset.fs) {
    S.fs[el.dataset.fs] = el.value;
    const e = el.dataset.e;
    if (S.errors[e] || S.errors.auth) {
      delete S.errors[e]; delete S.errors.auth;
      document.querySelectorAll(`[data-e="${e}"]`).forEach((n) => { n.classList.remove('invalid'); n.removeAttribute('aria-invalid'); });
      document.getElementById('err-' + e)?.remove(); document.querySelector('.acc-form .banner')?.remove();
    }
    if (el.dataset.fs === 'password') { const ul = document.getElementById('pw-rules'); if (ul) ul.innerHTML = rulesHtml(); }
    return;
  }
  if (!el.dataset.k && !el.dataset.lk) return;
  if (el.dataset.fmt === 'phone') {
    const v = digits(el.value).slice(0, 10);
    el.value = v.length > 6 ? `(${v.slice(0, 3)}) ${v.slice(3, 6)}-${v.slice(6)}` : v.length > 3 ? `(${v.slice(0, 3)}) ${v.slice(3)}` : v;
  }
  if (el.dataset.fmt === 'dob' && ev.inputType !== 'deleteContentBackward') {
    const v = digits(el.value).slice(0, 8);
    el.value = [v.slice(0, 2), v.slice(2, 4), v.slice(4)].filter(Boolean).join(' / ');
  }
  if (el.dataset.lk) { S.modal[el.dataset.lk] = el.value; if (S.modal.err[el.dataset.lk]) { delete S.modal.err[el.dataset.lk]; el.closest('.lk-field')?.classList.remove('bad'); el.closest('.lk-field')?.nextElementSibling?.matches('.lk-err') && el.closest('.lk-field').nextElementSibling.remove(); } return; }
  setField(el);
  if (el.dataset.k === 'descriptor') { const live = document.getElementById('stmt-live'); if (live) live.textContent = el.value || 'Example'; }
});
function setField(el) {
  S.d[el.dataset.k] = el.value;
  const e = el.dataset.e;
  if (e && S.errors[e]) {
    delete S.errors[e];
    document.querySelectorAll(`[data-e="${e}"]`).forEach((n) => { n.classList.remove('invalid'); n.removeAttribute('aria-invalid'); n.removeAttribute('aria-describedby'); });
    document.getElementById('err-' + e)?.remove();
  }
}
document.addEventListener('keydown', (ev) => {
  if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches('tr[data-act]')) { ev.preventDefault(); ev.target.click(); return; }
  if (ev.key !== 'Escape') return;
  if (S.modal && !S.modal.busy && !['loading', 'saving'].includes(S.modal.phase)) { S.modal = null; renderLayer(); }
  else if (S.mg?.pop) { S.mg.pop = null; render(); }
  else if (S.progressOpen) { S.progressOpen = false; render(); }
  else if (S.protoOpen) { S.protoOpen = false; renderLayer(); }
});

window.addEventListener('hashchange', () => { S.errors = {}; render(); document.getElementById('main')?.scrollTo(0, 0); window.scrollTo(0, 0); });
render();
})();
</script>
